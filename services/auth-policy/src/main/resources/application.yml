spring:
  application:
    name: gcs-saker-auth-policy
  threads:
    virtual:
      enabled: true

server:
  shutdown: graceful

management:
  endpoints:
    web:
      base-path: /actuator
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
  tracing:
    sampling:
      probability: ${AUTH_POLICY_TRACING_SAMPLING_PROBABILITY:1.0}

logging:
  pattern:
    level: "%5p [traceId:%X{traceId:-},correlationId:%X{correlationId:-}]"
