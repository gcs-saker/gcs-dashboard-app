spring:
  application:
    name: gcs-saker-auth-policy
  autoconfigure:
    exclude: org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
  threads:
    virtual:
      enabled: true
  flyway:
    enabled: true
    locations: classpath:db/migration,classpath:db/{vendor}-migration
    baseline-on-migrate: true
    baseline-version: 0
  jpa:
    open-in-view: false

server:
  shutdown: graceful

management:
  endpoints:
    web:
      base-path: /actuator
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
  tracing:
    sampling:
      probability: ${AUTH_POLICY_TRACING_SAMPLING_PROBABILITY:1.0}
    export:
      otlp:
        enabled: ${AUTH_POLICY_OTEL_TRACES_ENABLED:false}
  opentelemetry:
    tracing:
      export:
        schedule-delay: ${AUTH_POLICY_OTEL_SCHEDULE_DELAY:2s}
        timeout: ${AUTH_POLICY_OTEL_EXPORT_TIMEOUT:1s}
        max-queue-size: ${AUTH_POLICY_OTEL_MAX_QUEUE_SIZE:512}
        max-batch-size: ${AUTH_POLICY_OTEL_MAX_BATCH_SIZE:128}
        otlp:
          endpoint: ${AUTH_POLICY_OTEL_ENDPOINT:http://otel-collector:4318/v1/traces}
          timeout: ${AUTH_POLICY_OTEL_EXPORT_TIMEOUT:1s}

logging:
  pattern:
    level: "%5p [traceId:%X{traceId:-},correlationId:%X{correlationId:-}]"

gcs:
  audit:
    anchor:
      enabled: ${AUTH_POLICY_AUDIT_ANCHOR_ENABLED:false}
      directory: ${AUTH_POLICY_AUDIT_ANCHOR_DIRECTORY:/var/lib/gcs-audit-anchor}
      hmac-key: ${AUTH_POLICY_AUDIT_ANCHOR_HMAC_KEY:}
      source-commit: ${SOURCE_COMMIT:unknown}
      interval-millis: ${AUTH_POLICY_AUDIT_ANCHOR_INTERVAL_MILLIS:300000}
