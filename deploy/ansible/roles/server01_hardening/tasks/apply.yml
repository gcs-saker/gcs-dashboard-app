---
- name: Install approved host security packages
  ansible.builtin.apt:
    name:
      - auditd
      - chrony
      - ufw
    state: present
    update_cache: true

- name: Harden SSH daemon settings
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: "^#?{{ item.key }}\\s+"
    line: "{{ item.key }} {{ item.value }}"
    validate: /usr/sbin/sshd -t -f %s
  loop:
    - { key: Port, value: "55121" }
    - { key: PermitRootLogin, value: "no" }
    - { key: PasswordAuthentication, value: "no" }
    - { key: X11Forwarding, value: "no" }
  notify: Reload SSH daemon

- name: Set default inbound firewall policy
  community.general.ufw:
    direction: incoming
    policy: deny

- name: Allow reviewed Server-01 host TCP ingress
  community.general.ufw:
    rule: allow
    port: "{{ item }}"
    proto: tcp
  loop: "{{ server01_required_tcp_ports }}"

- name: Enable host firewall
  community.general.ufw:
    state: enabled

- name: Protect runtime materialized secrets
  ansible.builtin.file:
    path: "{{ server01_runtime_secret_root }}"
    state: directory
    owner: root
    group: "{{ server01_secret_runtime_gid }}"
    mode: "0750"

- name: Enable required host services
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    enabled: true
    state: started
  loop: "{{ server01_required_services }}"
