services:
  media-control:
    environment:
      TURN_CREDENTIAL_MODE: static
    secrets:
      - source: turn_static_password
        target: TURN_PASSWORD
        uid: "10001"
        gid: "10001"
        mode: 0400
  mediamtx:
    secrets:
      - source: turn_static_password
        target: TURN_PASSWORD
        uid: "10001"
        gid: "10001"
        mode: 0400

secrets:
  turn_static_password:
    file: ${GCS_RUNTIME_SECRET_DIR:-/run/gcs-saker-secrets}/TURN_PASSWORD
