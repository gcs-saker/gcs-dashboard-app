name: ${COMPOSE_PROJECT_NAME:-gcs-saker-arch-poc}

x-env-files: &service_env_files
  - path: ./.env.single-node
    required: false
  - path: ./.env.single-node.example
    required: true

x-health-defaults: &health_defaults
  interval: 10s
  timeout: 5s
  retries: 20
  start_period: 10s

x-runtime-hardening: &runtime_hardening
  read_only: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  pids_limit: 256

x-logging-defaults: &logging_defaults
  driver: json-file
  options:
    max-size: ${CONTAINER_LOG_MAX_SIZE:-10m}
    max-file: ${CONTAINER_LOG_MAX_FILES:-3}

services:
  postgres-geo:
    image: postgis/postgis@sha256:44126d872ac91993766c341e369c539e8196614321765d36a6f1bab0419a5fa5
    pids_limit: 256
    mem_limit: ${POSTGRES_MEMORY_LIMIT:-1g}
    cpus: ${POSTGRES_CPU_LIMIT:-1.5}
    logging: *logging_defaults
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-gcs_geo}
      POSTGRES_USER: ${POSTGRES_USER:-gcs_geo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - postgres-geo-data:/var/lib/postgresql/data
      - type: bind
        source: ../postgres/init
        target: /docker-entrypoint-initdb.d
        read_only: true
    healthcheck:
      <<: *health_defaults
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-gcs_geo} -d ${POSTGRES_DB:-gcs_geo}"]
    restart: unless-stopped
    networks:
      - control-net

  redis:
    image: redis@sha256:6ab0b6e7381779332f97b8ca76193e45b0756f38d4c0dcda72dbb3c32061ab99
    pids_limit: 128
    mem_limit: ${REDIS_MEMORY_LIMIT:-512m}
    cpus: ${REDIS_CPU_LIMIT:-0.75}
    logging: *logging_defaults
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD}
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --maxmemory
      - ${REDIS_MAXMEMORY:-384mb}
      - --maxmemory-policy
      - ${REDIS_MAXMEMORY_POLICY:-volatile-ttl}
      - --auto-aof-rewrite-percentage
      - "100"
      - --auto-aof-rewrite-min-size
      - ${REDIS_AOF_REWRITE_MIN_SIZE:-64mb}
      - --requirepass
      - ${REDIS_PASSWORD:?Set REDIS_PASSWORD}
    volumes:
      - redis-data:/data
    healthcheck:
      <<: *health_defaults
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" ping | grep PONG"]
    restart: unless-stopped
    networks:
      - control-net

  mqtt:
    image: eclipse-mosquitto@sha256:a908c65cc8e67ec9d292ef27c2c0360dbaaee7eb1b935cdd194e67697f15dea1
    pids_limit: 128
    mem_limit: ${MQTT_MEMORY_LIMIT:-256m}
    cpus: ${MQTT_CPU_LIMIT:-0.5}
    logging: *logging_defaults
    command: ["mosquitto", "-c", "/mosquitto/config/mosquitto.conf"]
    environment:
      MQTT_HEALTH_USERNAME: ${MQTT_HEALTH_USERNAME:?Set MQTT_HEALTH_USERNAME}
      MQTT_HEALTH_PASSWORD: ${MQTT_HEALTH_PASSWORD:?Set MQTT_HEALTH_PASSWORD}
    volumes:
      - type: bind
        source: ../mosquitto/mosquitto.hardened.conf
        target: /mosquitto/config/mosquitto.conf
        read_only: true
      - type: bind
        source: ../mosquitto/acl.hardened
        target: /mosquitto/config/acl
        read_only: true
      - type: bind
        source: ${MQTT_PASSWORD_FILE:?Set MQTT_PASSWORD_FILE}
        target: /mosquitto/config/passwords
        read_only: true
      - mqtt-data:/mosquitto/data
    healthcheck:
      <<: *health_defaults
      test:
        [
          "CMD-SHELL",
          "mosquitto_sub -h 127.0.0.1 -p 1883 -u \"$${MQTT_HEALTH_USERNAME}\" -P \"$${MQTT_HEALTH_PASSWORD}\" -t '$$SYS/broker/version' -C 1 -W 3 >/dev/null",
        ]
    restart: unless-stopped
    networks:
      - media-net

  backend:
    <<: *runtime_hardening
    tmpfs: ["/tmp:rw,noexec,nosuid,nodev,size=64m"]
    mem_limit: ${BACKEND_MEMORY_LIMIT:-768m}
    cpus: ${BACKEND_CPU_LIMIT:-1.5}
    logging: *logging_defaults
    image: ${BACKEND_IMAGE:-gcs-saker-backend:arch-poc}
    build:
      context: ../../backend
      args:
        SOURCE_COMMIT: ${SOURCE_COMMIT:-unknown}
    env_file: *service_env_files
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL}
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET:?Set AUTH_JWT_SECRET}
      AUTH_ACCESS_TOKEN_EXPIRE_MINUTES: ${AUTH_ACCESS_TOKEN_EXPIRE_MINUTES:-30}
      AUTH_REFRESH_TOKEN_EXPIRE_MINUTES: ${AUTH_REFRESH_TOKEN_EXPIRE_MINUTES:-120}
      AUTH_REFRESH_COOKIE_SECURE: ${AUTH_REFRESH_COOKIE_SECURE:-true}
      AUTH_REFRESH_COOKIE_SAMESITE: ${AUTH_REFRESH_COOKIE_SAMESITE:-lax}
      AUTH_JWT_ISSUER: ${AUTH_JWT_ISSUER:-gcs-saker}
      BACKEND_CORS_ALLOW_ORIGINS: ${BACKEND_CORS_ALLOW_ORIGINS:-http://localhost:8080}
      AI_PROCESSOR_ENDPOINTS_JSON: ${AI_PROCESSOR_ENDPOINTS_JSON:-{}}
      AI_STREAM_BASE_URL: ${AI_STREAM_BASE_URL:-http://mediamtx:8889}
      AI_ADAPTER_TIMEOUT_SECONDS: ${AI_ADAPTER_TIMEOUT_SECONDS:-2.0}
      MQTT_HOST: ${MQTT_HOST:-mqtt}
      MQTT_PORT: ${MQTT_PORT:-1883}
      MQTT_CLIENT_ID: ${MQTT_CLIENT_ID:-gcs_backend_pub}
      MQTT_KEEPALIVE: ${MQTT_KEEPALIVE:-60}
      MQTT_RECONNECT_MIN_DELAY_SECONDS: ${MQTT_RECONNECT_MIN_DELAY_SECONDS:-1}
      MQTT_RECONNECT_MAX_DELAY_SECONDS: ${MQTT_RECONNECT_MAX_DELAY_SECONDS:-30}
      MQTT_MAX_INFLIGHT_MESSAGES: ${MQTT_MAX_INFLIGHT_MESSAGES:-20}
      MQTT_USERNAME: ${MQTT_USERNAME:?Set MQTT_USERNAME}
      MQTT_PASSWORD: ${MQTT_PASSWORD:?Set MQTT_PASSWORD}
      TELEMETRY_BUFFER_AUTO_FLUSH_MAX_ITEMS: ${TELEMETRY_BUFFER_AUTO_FLUSH_MAX_ITEMS:-1000}
      TELEMETRY_BUFFER_MAX_PENDING_HISTORY: ${TELEMETRY_BUFFER_MAX_PENDING_HISTORY:-10000}
      CONTROL_MESSAGE_SENDER: ${CONTROL_MESSAGE_SENDER:-mqtt}
      CONTROL_GRPC_TARGET: ${CONTROL_GRPC_TARGET:-media-control:9090}
      CONTROL_GRPC_AUTH_TOKEN: ${CONTROL_GRPC_AUTH_TOKEN:-${MEDIA_CONTROL_PUBLISH_TOKEN:?Set MEDIA_CONTROL_PUBLISH_TOKEN}}
      MEDIAMTX_PUBLIC_WEBRTC_BASE_URL: ${MEDIAMTX_PUBLIC_WEBRTC_BASE_URL:-http://localhost:8080/webrtc}
      MEDIAMTX_PUBLIC_HLS_BASE_URL: ${MEDIAMTX_PUBLIC_HLS_BASE_URL:-http://localhost:8080/hls}
      MEDIAMTX_API_BASE_URL: ${MEDIAMTX_API_BASE_URL:-http://mediamtx:9997}
      WEBRTC_STUN_URL: ${WEBRTC_STUN_URL:-stun:turn-primary:3478}
      DASHBOARD_MAP_PROVIDER: ${DASHBOARD_MAP_PROVIDER:-esri-satellite}
      DASHBOARD_MAP_STYLE_URL: ${DASHBOARD_MAP_STYLE_URL:-https://services.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}}
      DASHBOARD_MAP_ATTRIBUTION: ${DASHBOARD_MAP_ATTRIBUTION:-Esri World Imagery}
      DASHBOARD_MAP_REQUIRES_API_KEY: ${DASHBOARD_MAP_REQUIRES_API_KEY:-false}
      WEBRTC_TURN_URL: ${WEBRTC_TURN_URL:-turn:turn-primary:3478?transport=udp}
      WEBRTC_TURN_USERNAME: ${TURN_USERNAME:-gcs-turn}
      WEBRTC_TURN_PASSWORD: ${TURN_PASSWORD:?Set TURN_PASSWORD}
    depends_on:
      postgres-geo:
        condition: service_healthy
      mqtt:
        condition: service_started
      mediamtx:
        condition: service_started
    healthcheck:
      <<: *health_defaults
      test: ["CMD-SHELL", "python - <<'PY'\nimport urllib.request\nurllib.request.urlopen('http://127.0.0.1:8001/healthz', timeout=2).read()\nPY"]
    restart: unless-stopped
    networks:
      - control-net
      - media-net

  auth-policy:
    <<: *runtime_hardening
    tmpfs: ["/tmp:rw,noexec,nosuid,nodev,size=128m"]
    mem_limit: ${AUTH_POLICY_MEMORY_LIMIT:-1g}
    cpus: ${AUTH_POLICY_CPU_LIMIT:-2.0}
    logging: *logging_defaults
    image: ${AUTH_POLICY_IMAGE:-gcs-saker-auth-policy:arch-poc}
    build:
      context: ../../services/auth-policy
      args:
        SOURCE_COMMIT: ${SOURCE_COMMIT:-unknown}
    env_file: *service_env_files
    environment:
      JAVA_TOOL_OPTIONS: ${AUTH_POLICY_JAVA_TOOL_OPTIONS:--Xms128m -Xmx512m -XX:MaxMetaspaceSize=192m -XX:MaxDirectMemorySize=64m -XX:+UseG1GC -XX:MaxGCPauseMillis=200 -XX:+ExitOnOutOfMemoryError}
      AUTH_POLICY_JWT_ISSUER: ${AUTH_JWT_ISSUER:-gcs-saker}
      AUTH_POLICY_JWT_SECRET: ${AUTH_JWT_SECRET:?Set AUTH_JWT_SECRET}
      AUTH_POLICY_ACCESS_TOKEN_EXPIRE_MINUTES: ${AUTH_ACCESS_TOKEN_EXPIRE_MINUTES:-30}
      AUTH_POLICY_REFRESH_TOKEN_EXPIRE_MINUTES: ${AUTH_REFRESH_TOKEN_EXPIRE_MINUTES:-120}
      AUTH_POLICY_REFRESH_COOKIE_SECURE: ${AUTH_REFRESH_COOKIE_SECURE:-true}
      AUTH_POLICY_REFRESH_COOKIE_SAMESITE: ${AUTH_REFRESH_COOKIE_SAMESITE:-lax}
      AUTH_POLICY_ALLOWED_ORIGINS: ${BACKEND_CORS_ALLOW_ORIGINS:-http://localhost:8080}
      AUTH_POLICY_ADMIN_PASSWORD: ${AUTH_POLICY_ADMIN_PASSWORD:?Set AUTH_POLICY_ADMIN_PASSWORD}
      AUTH_POLICY_OPERATOR_PASSWORD: ${AUTH_POLICY_OPERATOR_PASSWORD:?Set AUTH_POLICY_OPERATOR_PASSWORD}
      AUTH_POLICY_SMOKE_PASSWORD: ${AUTH_POLICY_SMOKE_PASSWORD:?Set AUTH_POLICY_SMOKE_PASSWORD}
      AUTH_POLICY_SIGNUP_INVITES: ${AUTH_POLICY_SIGNUP_INVITES:-}
      AUTH_POLICY_DEVICE_BOOTSTRAP_TOKENS: ${AUTH_POLICY_DEVICE_BOOTSTRAP_TOKENS:?Set AUTH_POLICY_DEVICE_BOOTSTRAP_TOKENS}
      AUTH_POLICY_TRACING_SAMPLING_PROBABILITY: ${AUTH_POLICY_TRACING_SAMPLING_PROBABILITY:-0.1}
      AUTH_POLICY_REDIS_PRINCIPAL_CACHE_ENABLED: ${AUTH_POLICY_REDIS_PRINCIPAL_CACHE_ENABLED:-true}
      AUTH_POLICY_REDIS_REFRESH_SESSION_ENABLED: ${AUTH_POLICY_REDIS_REFRESH_SESSION_ENABLED:-true}
      AUTH_POLICY_TRUSTED_PROXY_CIDRS: ${AUTH_POLICY_TRUSTED_PROXY_CIDRS:-127.0.0.0/8}
      SPRING_DATASOURCE_URL: ${AUTH_POLICY_DATASOURCE_URL:-jdbc:postgresql://postgres-geo:5432/${POSTGRES_DB:-gcs_geo}}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-gcs_geo}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      TIME_SYNC_MODE: ${TIME_SYNC_MODE:-public}
      TIME_SYNC_SOURCE_HOST: ${TIME_SYNC_SOURCE_HOST:-pool.ntp.org}
      TIME_SYNC_SOURCE_PORT: ${TIME_SYNC_SOURCE_PORT:-123}
      TIME_SYNC_DRIFT_WARN_MS: ${TIME_SYNC_DRIFT_WARN_MS:-1000}
      SPRING_DATA_REDIS_HOST: ${SPRING_DATA_REDIS_HOST:-redis}
      SPRING_DATA_REDIS_PORT: ${SPRING_DATA_REDIS_PORT:-6379}
      SPRING_DATA_REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD}
    healthcheck:
      <<: *health_defaults
      test: ["CMD-SHELL", "wget -q -O- http://127.0.0.1:8080/healthz >/dev/null"]
    depends_on:
      postgres-geo:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - control-net

  media-control:
    <<: *runtime_hardening
    tmpfs: ["/tmp:rw,noexec,nosuid,nodev,size=64m"]
    mem_limit: ${MEDIA_CONTROL_MEMORY_LIMIT:-768m}
    cpus: ${MEDIA_CONTROL_CPU_LIMIT:-2.0}
    logging: *logging_defaults
    image: ${MEDIA_CONTROL_IMAGE:-gcs-saker-media-control:arch-poc}
    build:
      context: ../../services/media-control
      args:
        SOURCE_COMMIT: ${SOURCE_COMMIT:-unknown}
    env_file: *service_env_files
    ports:
      # Host nginx terminates public TLS/HTTP2 and forwards gRPC here. Keep
      # this listener loopback-only; it is not a public plaintext endpoint.
      - "${LOCAL_BIND_ADDR:-127.0.0.1}:${MEDIA_CONTROL_GRPC_HOST_PORT:-9090}:9090"
    environment:
      MEDIAMTX_API_BASE_URL: ${MEDIAMTX_API_BASE_URL:-http://mediamtx:9997}
      TURN_USERNAME: ${TURN_USERNAME:-gcs-turn}
      TURN_PASSWORD: ${TURN_PASSWORD:?Set TURN_PASSWORD}
      MEDIA_CONTROL_PUBLIC_WEBRTC_BASE_URL: ${MEDIA_CONTROL_PUBLIC_WEBRTC_BASE_URL:-http://localhost:8080/webrtc}
      MEDIA_CONTROL_PUBLIC_HLS_BASE_URL: ${MEDIA_CONTROL_PUBLIC_HLS_BASE_URL:-http://localhost:8080/hls}
      MEDIA_CONTROL_EXPECTED_PUBLIC_ORIGIN: ${MEDIA_CONTROL_EXPECTED_PUBLIC_ORIGIN:-}
      MEDIA_CONTROL_AUTH_MODE: ${MEDIA_CONTROL_AUTH_MODE:-required}
      AUTH_POLICY_BASE_URL: ${AUTH_POLICY_BASE_URL:-http://auth-policy:8080}
      MEDIA_CONTROL_AUTHZ_CACHE_TTL_SECONDS: ${MEDIA_CONTROL_AUTHZ_CACHE_TTL_SECONDS:-2}
      MEDIA_CONTROL_STUN_URL: ${MEDIA_CONTROL_STUN_URL:-stun:stun.l.google.com:19302}
      MEDIA_CONTROL_TURN_PRIMARY_URL: ${MEDIA_CONTROL_TURN_PRIMARY_URL:-turn:localhost:3478?transport=udp}
      MEDIA_CONTROL_TURN_SECONDARY_URL: ${MEDIA_CONTROL_TURN_SECONDARY_URL:-}
      MEDIA_CONTROL_TURN_MAX_HEALTHY_SERVERS: ${MEDIA_CONTROL_TURN_MAX_HEALTHY_SERVERS:-1}
      MEDIA_CONTROL_ICE_SERVER_CACHE_TTL_SECONDS: ${MEDIA_CONTROL_ICE_SERVER_CACHE_TTL_SECONDS:-10}
      MEDIA_CONTROL_ICE_SERVER_CACHE_KEY: ${MEDIA_CONTROL_ICE_SERVER_CACHE_KEY:-gcs-saker:media-control:ice-servers}
      MEDIA_CONTROL_DEFAULT_PUBLISHER_GROUP_ID: ${MEDIA_CONTROL_DEFAULT_PUBLISHER_GROUP_ID:-co-a}
      MEDIA_CONTROL_STREAM_GROUP_MAP: ${MEDIA_CONTROL_STREAM_GROUP_MAP:-raw/sample/front=co-a,raw/local/webcam=co-a}
      MEDIA_CONTROL_PUBLISH_TOKEN: ${MEDIA_CONTROL_PUBLISH_TOKEN:?Set MEDIA_CONTROL_PUBLISH_TOKEN}
      MEDIA_CONTROL_LISTEN_ADDR: :8081
      MEDIA_CONTROL_GRPC_LISTEN_ADDR: :9090
      MEDIA_CONTROL_GRPC_TOKEN: ${MEDIA_CONTROL_GRPC_TOKEN:-${MEDIA_CONTROL_PUBLISH_TOKEN:?Set MEDIA_CONTROL_PUBLISH_TOKEN}}
      MEDIA_CONTROL_GRPC_MAX_PAYLOAD_BYTES: ${MEDIA_CONTROL_GRPC_MAX_PAYLOAD_BYTES:-65536}
      GOGC: ${MEDIA_CONTROL_GOGC:-100}
      GOMEMLIMIT: ${MEDIA_CONTROL_GOMEMLIMIT:-512MiB}
      MEDIA_CONTROL_TRACE_EXPORTER: ${MEDIA_CONTROL_TRACE_EXPORTER:-none}
      MEDIA_CONTROL_OTEL_SERVICE_NAME: ${MEDIA_CONTROL_OTEL_SERVICE_NAME:-gcs-saker-media-control}
      MEDIA_CONTROL_REDIS_ADDR: ${MEDIA_CONTROL_REDIS_ADDR:-redis:6379}
      MEDIA_CONTROL_REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD}
      MEDIA_CONTROL_STREAM_CACHE_TTL_SECONDS: ${MEDIA_CONTROL_STREAM_CACHE_TTL_SECONDS:-1}
      MEDIA_CONTROL_STREAM_PRESENCE_TTL_SECONDS: ${MEDIA_CONTROL_STREAM_PRESENCE_TTL_SECONDS:-6}
    healthcheck:
      <<: *health_defaults
      test: ["CMD-SHELL", "wget -q -O- http://127.0.0.1:8081/healthz >/dev/null"]
    depends_on:
      redis:
        condition: service_healthy
      mediamtx:
        condition: service_started
      turn-primary:
        condition: service_started
      auth-policy:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - control-net
      - media-net

  mediamtx:
    image: bluenviron/mediamtx@sha256:32ecec42d5c716f0b85809b11b6c32f54126546ba89fc85ac57dbcf74738bb4e
    pids_limit: 512
    mem_limit: ${MEDIAMTX_MEMORY_LIMIT:-1g}
    cpus: ${MEDIAMTX_CPU_LIMIT:-2.0}
    logging: *logging_defaults
    env_file: *service_env_files
    environment:
      MTX_WEBRTCIPSFROMINTERFACES: ${MEDIAMTX_WEBRTC_IPS_FROM_INTERFACES:-true}
      MTX_WEBRTCADDITIONALHOSTS: ${MEDIAMTX_WEBRTC_ADDITIONAL_HOSTS:-127.0.0.1}
    ports:
      - "${LOCAL_BIND_ADDR:-127.0.0.1}:${MEDIAMTX_RTSP_PORT:-8554}:8554/tcp"
      - "${LOCAL_BIND_ADDR:-127.0.0.1}:${MEDIAMTX_RTMP_PORT:-1935}:1935/tcp"
      - "${LOCAL_BIND_ADDR:-127.0.0.1}:${MEDIAMTX_SRT_PORT:-8890}:8890/udp"
      - "${MEDIAMTX_ICE_BIND_ADDR:-127.0.0.1}:${MEDIAMTX_WEBRTC_ICE_UDP_PORT:-8189}:8189/udp"
      - "${MEDIAMTX_ICE_BIND_ADDR:-127.0.0.1}:${MEDIAMTX_WEBRTC_ICE_TCP_PORT:-8189}:8189/tcp"
    volumes:
      - type: bind
        source: ../mediamtx/mediamtx.closed-network.yml
        target: /mediamtx.yml
        read_only: true
    command: /mediamtx.yml
    restart: unless-stopped
    networks:
      - media-net

  turn-primary:
    image: coturn/coturn@sha256:71c3c990283385567f11794ee692e3a47b66fd9b0bb39e42afbe776e331dd888
    pids_limit: 256
    mem_limit: ${TURN_MEMORY_LIMIT:-256m}
    cpus: ${TURN_CPU_LIMIT:-0.5}
    logging: *logging_defaults
    env_file: *service_env_files
    entrypoint: ["turnserver"]
    command:
      - -n
      - --log-file=stdout
      - --fingerprint
      - --lt-cred-mech
      - --realm=${TURN_REALM:-gcs-saker.closed}
      - --user=${TURN_USERNAME:-gcs-turn}:${TURN_PASSWORD:?Set TURN_PASSWORD}
      - --listening-port=3478
      - --min-port=${TURN_RELAY_MIN_PORT:-49160}
      - --max-port=${TURN_RELAY_MAX_PORT:-49200}
      - --external-ip=${TURN_EXTERNAL_IP:-127.0.0.1}
      - --no-cli
    ports:
      - "${TURN_PUBLIC_BIND_ADDR:-127.0.0.1}:${TURN_PRIMARY_HOST_PORT:-3478}:3478/tcp"
      - "${TURN_PUBLIC_BIND_ADDR:-127.0.0.1}:${TURN_PRIMARY_HOST_PORT:-3478}:3478/udp"
      - "${TURN_PUBLIC_BIND_ADDR:-127.0.0.1}:${TURN_PRIMARY_RELAY_HOST_MIN_PORT:-49160}-${TURN_PRIMARY_RELAY_HOST_MAX_PORT:-49180}:49160-49180/udp"
    healthcheck:
      <<: *health_defaults
      test: ["CMD-SHELL", "timeout 2 sh -c '</dev/udp/127.0.0.1/3478' || exit 0"]
    restart: unless-stopped
    networks:
      - media-net

  turn-secondary:
    profiles: [same-host-turn-redundancy]
    image: coturn/coturn@sha256:71c3c990283385567f11794ee692e3a47b66fd9b0bb39e42afbe776e331dd888
    pids_limit: 256
    mem_limit: ${TURN_MEMORY_LIMIT:-256m}
    cpus: ${TURN_CPU_LIMIT:-0.5}
    logging: *logging_defaults
    env_file: *service_env_files
    entrypoint: ["turnserver"]
    command:
      - -n
      - --log-file=stdout
      - --fingerprint
      - --lt-cred-mech
      - --realm=${TURN_REALM:-gcs-saker.closed}
      - --user=${TURN_USERNAME:-gcs-turn}:${TURN_PASSWORD:?Set TURN_PASSWORD}
      - --listening-port=3478
      - --min-port=49181
      - --max-port=${TURN_RELAY_MAX_PORT:-49200}
      - --external-ip=${TURN_EXTERNAL_IP:-127.0.0.1}
      - --no-cli
    ports:
      - "${TURN_PUBLIC_BIND_ADDR:-127.0.0.1}:${TURN_SECONDARY_HOST_PORT:-3479}:3478/tcp"
      - "${TURN_PUBLIC_BIND_ADDR:-127.0.0.1}:${TURN_SECONDARY_HOST_PORT:-3479}:3478/udp"
      - "${TURN_PUBLIC_BIND_ADDR:-127.0.0.1}:${TURN_SECONDARY_RELAY_HOST_MIN_PORT:-49181}-${TURN_SECONDARY_RELAY_HOST_MAX_PORT:-49200}:49181-49200/udp"
    healthcheck:
      <<: *health_defaults
      test: ["CMD-SHELL", "timeout 2 sh -c '</dev/udp/127.0.0.1/3478' || exit 0"]
    restart: unless-stopped
    networks:
      - media-net

  dashboard:
    <<: *runtime_hardening
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=16m,mode=1777
      - /var/cache/nginx:rw,noexec,nosuid,nodev,size=16m,uid=101,gid=101,mode=0755
    mem_limit: ${DASHBOARD_MEMORY_LIMIT:-256m}
    cpus: ${DASHBOARD_CPU_LIMIT:-0.5}
    logging: *logging_defaults
    image: ${DASHBOARD_IMAGE:-gcs-saker-dashboard:arch-poc}
    build:
      context: ../../gcs-dashboard
      args:
        SOURCE_COMMIT: ${SOURCE_COMMIT:-unknown}
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api}
        VITE_IDENTITY_API_BASE_URL: ${VITE_AUTH_API_BASE_URL:-/auth-policy/auth}
        VITE_STREAM_API_BASE_URL: ${VITE_STREAM_API_BASE_URL:-/media-control}
        VITE_HLS_BASE_URL: ${VITE_HLS_BASE_URL:-/hls}
        VITE_DEFAULT_STREAM_ID: ${VITE_DEFAULT_STREAM_ID:-raw/local/webcam}
        VITE_LOCAL_WEBCAM_WHIP_URL: ${VITE_LOCAL_WEBCAM_WHIP_URL:-http://localhost:8080/webrtc/raw/local/webcam/whip}
        VITE_WEBRTC_STUN_URL: ${VITE_WEBRTC_STUN_URL:-stun:stun.l.google.com:19302}
        VITE_MAP_PROVIDER: ${VITE_MAP_PROVIDER:-esri-satellite}
        VITE_MAP_STYLE_URL: ${VITE_MAP_STYLE_URL:-https://services.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}}
    healthcheck:
      <<: *health_defaults
      test: ["CMD-SHELL", "wget -q -O- http://127.0.0.1:3000/ >/dev/null"]
    restart: unless-stopped
    networks:
      - control-net

  mobile-publisher:
    image: ${MOBILE_PUBLISHER_IMAGE:-gcs-mobile-publisher:latest}
    pids_limit: 128
    mem_limit: ${MOBILE_PUBLISHER_MEMORY_LIMIT:-256m}
    cpus: ${MOBILE_PUBLISHER_CPU_LIMIT:-0.5}
    logging: *logging_defaults
    healthcheck:
      <<: *health_defaults
      test: ["CMD-SHELL", "wget -q -O- http://127.0.0.1:8080/healthz >/dev/null"]
    restart: unless-stopped
    networks:
      - control-net

  edge:
    <<: *runtime_hardening
    image: nginxinc/nginx-unprivileged:1.29-alpine@sha256:0c79d56aee561a1d81c63f00eee5fb5fe29279560cdc55e91425133104c7fbe6
    user: "101:101"
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=16m,mode=1777
      - /var/cache/nginx:rw,noexec,nosuid,nodev,size=16m,uid=101,gid=101,mode=0755
    mem_limit: ${EDGE_MEMORY_LIMIT:-256m}
    cpus: ${EDGE_CPU_LIMIT:-0.5}
    logging: *logging_defaults
    ports:
      - "${PUBLIC_HTTP_BIND_ADDR:-127.0.0.1}:${PUBLIC_HTTP_PORT:-8080}:8080"
    volumes:
      - type: bind
        source: ${EDGE_NGINX_CONFIG_FILE:-../nginx/single-node.poc.conf}
        target: /etc/nginx/nginx.conf
        read_only: true
    depends_on:
      auth-policy:
        condition: service_healthy
      dashboard:
        condition: service_healthy
      mobile-publisher:
        condition: service_healthy
      media-control:
        condition: service_started
      mediamtx:
        condition: service_started
    healthcheck:
      <<: *health_defaults
      test: ["CMD-SHELL", "wget -q -O- http://127.0.0.1:8080/healthz >/dev/null"]
    restart: unless-stopped
    networks:
      - control-net
      - media-net

networks:
  control-net:
    driver: bridge
    internal: true
  media-net:
    driver: bridge

volumes:
  postgres-geo-data:
  redis-data:
  mqtt-data:
