services:
  auth-policy:
    secrets:
      - source: auth_policy_rpc_previous_token
        target: GCS_INTERNAL_GRPC_PREVIOUS_TOKEN
        uid: "10002"
        gid: "10002"
        mode: 0400
      - source: audit_ingest_previous_token
        target: AUTH_POLICY_AUDIT_INGEST_PREVIOUS_TOKEN
        uid: "10002"
        gid: "10002"
        mode: 0400

secrets:
  auth_policy_rpc_previous_token:
    file: ${GCS_RUNTIME_SECRET_DIR:-/run/gcs-saker-secrets}/AUTH_POLICY_RPC_PREVIOUS_TOKEN
  audit_ingest_previous_token:
    file: ${GCS_RUNTIME_SECRET_DIR:-/run/gcs-saker-secrets}/AUTH_POLICY_AUDIT_INGEST_PREVIOUS_TOKEN
