extensions:
  health_check:
    endpoint: 0.0.0.0:13133

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
        max_recv_msg_size_mib: 4
      http:
        endpoint: 0.0.0.0:4318

processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 192
    spike_limit_mib: 48
  resource/sanitize:
    attributes:
      - {key: service.instance.id, action: delete}
      - {key: host.id, action: delete}
      - {key: process.command_line, action: delete}
  attributes/sanitize:
    actions:
      - {key: authorization, action: delete}
      - {key: http.request.header.authorization, action: delete}
      - {key: http.request.header.cookie, action: delete}
      - {key: url.query, action: delete}
      - {key: enduser.id, action: delete}
      - {key: user.name, action: delete}
      - {key: client.address, action: delete}
      - {key: network.peer.address, action: delete}
      - {key: device.uuid, action: delete}
      - {key: stream.id, action: delete}
  transform/privacy:
    error_mode: propagate
    trace_statements:
      - context: resource
        statements:
          - keep_keys(attributes, ["service.name"])
          - set(attributes["service.name"], "gcs-unknown") where attributes["service.name"] != "gcs-saker-backend" and attributes["service.name"] != "gcs-saker-media-control" and attributes["service.name"] != "gcs-saker-auth-policy"
      - context: scope
        statements:
          - set(name, "gcs.instrumentation")
          - set(version, "")
          - keep_keys(attributes, [])
      - context: span
        statements:
          - set(name, "gcs.request")
          - set(status.message, "")
          - set(trace_state, "")
          - keep_keys(attributes, ["http.request.method", "http.method", "http.response.status_code", "http.status_code"])
      - context: spanevent
        statements:
          - set(name, "gcs.event")
          - keep_keys(attributes, [])
    metric_statements:
      - context: resource
        statements:
          - keep_keys(attributes, ["service.name"])
          - set(attributes["service.name"], "gcs-unknown") where attributes["service.name"] != "gcs-saker-backend" and attributes["service.name"] != "gcs-saker-media-control" and attributes["service.name"] != "gcs-saker-auth-policy"
      - context: scope
        statements:
          - set(name, "gcs.instrumentation")
          - set(version, "")
          - keep_keys(attributes, [])
      - context: metric
        statements:
          - set(description, "")
      - context: datapoint
        statements:
          - keep_keys(attributes, [])
  filter/privacy:
    error_mode: propagate
    traces:
      span:
        - Len(links) > 0
    metrics:
      datapoint:
        - Len(exemplars) > 0
  batch:
    timeout: 2s
    send_batch_size: 512
    send_batch_max_size: 1024

exporters:
  debug:
    verbosity: basic
    sampling_initial: 5
    sampling_thereafter: 200
    sending_queue:
      enabled: true
      queue_size: 256
      num_consumers: 1
      block_on_overflow: false

service:
  extensions: [health_check]
  telemetry:
    logs:
      level: info
    metrics:
      level: normal
      readers:
        - pull:
            exporter:
              prometheus:
                host: 0.0.0.0
                port: 8888
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, filter/privacy, resource/sanitize, attributes/sanitize, transform/privacy, batch]
      exporters: [debug]
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, filter/privacy, resource/sanitize, attributes/sanitize, transform/privacy, batch]
      exporters: [debug]
