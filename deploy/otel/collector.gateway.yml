extensions:
  health_check:
    endpoint: 0.0.0.0:13133

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
        max_recv_msg_size_mib: 4
      http:
        endpoint: 0.0.0.0:4318

processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 192
    spike_limit_mib: 48
  resource/sanitize:
    attributes:
      - {key: service.instance.id, action: delete}
      - {key: host.id, action: delete}
      - {key: process.command_line, action: delete}
  attributes/sanitize:
    actions:
      - {key: authorization, action: delete}
      - {key: http.request.header.authorization, action: delete}
      - {key: http.request.header.cookie, action: delete}
      - {key: url.query, action: delete}
      - {key: enduser.id, action: delete}
      - {key: user.name, action: delete}
      - {key: client.address, action: delete}
      - {key: network.peer.address, action: delete}
      - {key: device.uuid, action: delete}
      - {key: stream.id, action: delete}
  batch:
    timeout: 2s
    send_batch_size: 512
    send_batch_max_size: 1024

exporters:
  debug:
    verbosity: basic
    sampling_initial: 5
    sampling_thereafter: 200

service:
  extensions: [health_check]
  telemetry:
    logs:
      level: info
    metrics:
      level: basic
      readers:
        - pull:
            exporter:
              prometheus:
                host: 0.0.0.0
                port: 8888
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, resource/sanitize, attributes/sanitize, batch]
      exporters: [debug]
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, resource/sanitize, attributes/sanitize, batch]
      exporters: [debug]
