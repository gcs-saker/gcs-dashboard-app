worker_processes auto;

events {
    worker_connections 4096;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65s;
    resolver 127.0.0.11 valid=10s ipv6=off;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        "" close;
    }

    upstream gcs_dashboard {
        server dashboard:3000;
        keepalive 32;
    }

    upstream gcs_backend {
        server backend:8001;
        keepalive 32;
    }

    upstream gcs_auth_policy {
        server auth-policy:8080;
        keepalive 16;
    }

    upstream gcs_media_control {
        server media-control:8081;
        keepalive 16;
    }

    upstream gcs_mediamtx_hls {
        server mediamtx:8888;
        keepalive 16;
    }

    upstream gcs_mediamtx_webrtc {
        server mediamtx:8889;
        keepalive 16;
    }

    server {
        listen 80;
        server_name _;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto http;
        set $dashboard_host dashboard;
        set $backend_host backend;
        set $auth_policy_host auth-policy;
        set $media_control_host media-control;
        set $mediamtx_host mediamtx;

        location = /healthz {
            proxy_pass http://$auth_policy_host:8080/healthz;
            proxy_http_version 1.1;
        }

        location = /readyz {
            proxy_pass http://$auth_policy_host:8080/readyz;
            proxy_http_version 1.1;
        }

        location /api/auth/ {
            # Legacy fallback only. M7 dashboard builds use /auth-policy/auth.
            rewrite ^/api/auth/(.*)$ /auth/$1 break;
            proxy_pass http://$backend_host:8001;
            proxy_http_version 1.1;
        }

        location = /api/v1/map/config {
            # Legacy allowlist until map config moves behind auth-policy read model.
            proxy_pass http://$backend_host:8001/api/v1/map/config;
            proxy_http_version 1.1;
            add_header Deprecation "true" always;
            add_header X-GCS-Replacement-Route "/auth-policy/map/config" always;
        }

        location /auth-policy/ {
            rewrite ^/auth-policy/(.*)$ /$1 break;
            proxy_pass http://$auth_policy_host:8080;
            proxy_http_version 1.1;
        }

        location /auth-policy/actuator/ {
            return 404;
        }

        location = /media-control/metrics {
            return 404;
        }

        location /media-control/ {
            rewrite ^/media-control/(.*)$ /$1 break;
            proxy_pass http://$media_control_host:8081;
            proxy_http_version 1.1;
        }

        location /api/asset/ {
            rewrite ^/api/asset/(.*)$ /asset/$1 break;
            proxy_pass http://$auth_policy_host:8080;
            proxy_http_version 1.1;
        }

        location = /api/telemetry/all {
            proxy_pass http://$auth_policy_host:8080/telemetry/all;
            proxy_http_version 1.1;
        }

        location /api/telemetry/ {
            rewrite ^/api/telemetry/(.*)$ /telemetry/$1 break;
            proxy_pass http://$auth_policy_host:8080;
            proxy_http_version 1.1;
        }

        location = /api/ops/events/stream {
            proxy_pass http://$auth_policy_host:8080/ops/events/stream;
            proxy_http_version 1.1;
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 65s;
            add_header Cache-Control no-cache always;
            add_header X-Accel-Buffering no always;
        }

        location /api/ops/ {
            rewrite ^/api/ops/(.*)$ /ops/$1 break;
            proxy_pass http://$auth_policy_host:8080;
            proxy_http_version 1.1;
        }

        location /api/stream/ {
            rewrite ^/api/stream/(.*)$ /stream/$1 break;
            proxy_pass http://$media_control_host:8081;
            proxy_http_version 1.1;
            add_header Deprecation "true" always;
            add_header X-GCS-Replacement-Route "/media-control/api/v1/streams" always;
        }

        location /stream/ {
            proxy_pass http://$media_control_host:8081;
            proxy_http_version 1.1;
            add_header Deprecation "true" always;
            add_header X-GCS-Replacement-Route "/media-control/api/v1/streams" always;
        }

        location /api/ {
            add_header Deprecation "true" always;
            add_header X-GCS-Legacy-Fallback "disabled" always;
            return 410;
        }

        location = /ws/v1/telemetry {
            proxy_pass http://$auth_policy_host:8080;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Authorization $http_authorization;
            proxy_read_timeout 75s;
            proxy_send_timeout 75s;
            proxy_buffering off;
        }

        location /ws/ {
            add_header Deprecation "true" always;
            add_header X-GCS-Legacy-Fallback "disabled" always;
            return 410;
        }

        location /hls/ {
            rewrite ^/hls/(.*)$ /$1 break;
            proxy_pass http://$mediamtx_host:8888;
            proxy_http_version 1.1;
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 30s;
            add_header Cache-Control no-cache always;
        }

        location /webrtc/ {
            rewrite ^/webrtc/(.*)$ /$1 break;
            proxy_pass http://$mediamtx_host:8889;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 3600s;
        }

        location / {
            proxy_pass http://$dashboard_host:3000;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
        }
    }
}
