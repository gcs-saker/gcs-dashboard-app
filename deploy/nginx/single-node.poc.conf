worker_processes auto;

events {
    worker_connections 4096;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65s;
    resolver 127.0.0.11 valid=10s ipv6=off;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        "" close;
    }

    upstream gcs_dashboard {
        server dashboard:3000;
        keepalive 32;
    }

    upstream gcs_backend {
        server backend:8001;
        keepalive 32;
    }

    upstream gcs_auth_policy {
        server auth-policy:8080;
        keepalive 16;
    }

    upstream gcs_media_control {
        server media-control:8081;
        keepalive 16;
    }

    upstream gcs_mediamtx_hls {
        server mediamtx:8888;
        keepalive 16;
    }

    upstream gcs_mediamtx_webrtc {
        server mediamtx:8889;
        keepalive 16;
    }

    server {
        listen 80;
        server_name _;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto http;

        location = /healthz {
            proxy_pass http://gcs_auth_policy/healthz;
            proxy_http_version 1.1;
        }

        location = /readyz {
            proxy_pass http://gcs_auth_policy/readyz;
            proxy_http_version 1.1;
        }

        location /api/auth/ {
            # Legacy fallback only. M7 dashboard builds use /auth-policy/auth.
            rewrite ^/api/auth/(.*)$ /auth/$1 break;
            proxy_pass http://gcs_backend;
            proxy_http_version 1.1;
        }

        location /auth-policy/ {
            rewrite ^/auth-policy/(.*)$ /$1 break;
            proxy_pass http://gcs_auth_policy;
            proxy_http_version 1.1;
        }

        location = /media-control/metrics {
            return 404;
        }

        location /media-control/ {
            rewrite ^/media-control/(.*)$ /$1 break;
            proxy_pass http://gcs_media_control;
            proxy_http_version 1.1;
        }

        location /api/asset/ {
            rewrite ^/api/asset/(.*)$ /asset/$1 break;
            proxy_pass http://gcs_auth_policy;
            proxy_http_version 1.1;
        }

        location = /api/telemetry/all {
            proxy_pass http://gcs_auth_policy/telemetry/all;
            proxy_http_version 1.1;
        }

        location /api/telemetry/ {
            rewrite ^/api/telemetry/(.*)$ /telemetry/$1 break;
            proxy_pass http://gcs_auth_policy;
            proxy_http_version 1.1;
        }

        location = /api/ops/events/stream {
            proxy_pass http://gcs_auth_policy/ops/events/stream;
            proxy_http_version 1.1;
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 65s;
            add_header Cache-Control no-cache always;
            add_header X-Accel-Buffering no always;
        }

        location /api/ops/ {
            rewrite ^/api/ops/(.*)$ /ops/$1 break;
            proxy_pass http://gcs_auth_policy;
            proxy_http_version 1.1;
        }

        location /api/stream/ {
            rewrite ^/api/stream/(.*)$ /stream/$1 break;
            proxy_pass http://gcs_media_control;
            proxy_http_version 1.1;
            add_header Deprecation "true" always;
            add_header X-GCS-Replacement-Route "/media-control/api/v1/streams" always;
        }

        location /stream/ {
            proxy_pass http://gcs_media_control;
            proxy_http_version 1.1;
            add_header Deprecation "true" always;
            add_header X-GCS-Replacement-Route "/media-control/api/v1/streams" always;
        }

        location /api/ {
            # Legacy/future fallback for endpoints that are not M7 active runtime blockers.
            proxy_pass http://gcs_backend;
            proxy_http_version 1.1;
        }

        location /ws/ {
            # Legacy/future fallback until backend WebSocket contracts are redefined.
            proxy_pass http://gcs_backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        location /hls/ {
            rewrite ^/hls/(.*)$ /$1 break;
            proxy_pass http://gcs_mediamtx_hls;
            proxy_http_version 1.1;
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 30s;
            add_header Cache-Control no-cache always;
        }

        location /webrtc/ {
            rewrite ^/webrtc/(.*)$ /$1 break;
            proxy_pass http://gcs_mediamtx_webrtc;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 3600s;
        }

        location / {
            proxy_pass http://gcs_dashboard;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
        }
    }
}
