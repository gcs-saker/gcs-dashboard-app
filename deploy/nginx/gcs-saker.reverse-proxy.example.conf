worker_processes auto;

events {
    worker_connections 4096;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65s;
    resolver 127.0.0.11 valid=10s ipv6=off;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        "" close;
    }

    upstream gcs_dashboard {
        server dashboard:3000;
        keepalive 32;
    }

    upstream gcs_backend {
        server backend:8001;
        keepalive 32;
    }

    upstream gcs_auth_policy {
        server auth-policy:8080;
        keepalive 16;
    }

    upstream gcs_media_control {
        server media-control:8081;
        keepalive 16;
    }

    server {
        listen 80;
        server_name _;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    server {
        listen 443 ssl;
        http2 on;
        server_name _;

        ssl_certificate /etc/nginx/certs/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/privkey.pem;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1d;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers off;

        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy no-referrer-when-downgrade always;
        add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; media-src 'self' blob:; connect-src 'self' https: wss: stun: turn:; worker-src 'self' blob:;" always;
        add_header Permissions-Policy "camera=(self), microphone=(self), geolocation=(self)" always;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        location = /healthz {
            proxy_pass http://gcs_auth_policy/healthz;
            proxy_http_version 1.1;
            proxy_read_timeout 10s;
            proxy_send_timeout 10s;
        }

        location = /readyz {
            proxy_pass http://gcs_auth_policy/readyz;
            proxy_http_version 1.1;
            proxy_read_timeout 10s;
            proxy_send_timeout 10s;
        }

        location = /api/healthz {
            proxy_pass http://gcs_backend/healthz;
            proxy_http_version 1.1;
            proxy_read_timeout 10s;
            proxy_send_timeout 10s;
        }

        location = /api/readyz {
            proxy_pass http://gcs_backend/readyz;
            proxy_http_version 1.1;
            proxy_read_timeout 10s;
            proxy_send_timeout 10s;
        }

        location /api/auth/ {
            # Legacy fallback only. M7 dashboard builds use /auth-policy/auth.
            rewrite ^/api/auth/(.*)$ /auth/$1 break;
            proxy_pass http://gcs_backend;
            proxy_http_version 1.1;
            proxy_read_timeout 60s;
            proxy_send_timeout 60s;
        }

        location = /api/v1/map/config {
            # Legacy allowlist until map config moves behind auth-policy read model.
            proxy_pass http://gcs_backend/api/v1/map/config;
            proxy_http_version 1.1;
            proxy_read_timeout 60s;
            proxy_send_timeout 60s;
            add_header Deprecation "true" always;
            add_header X-GCS-Replacement-Route "/auth-policy/map/config" always;
        }

        location /auth-policy/ {
            rewrite ^/auth-policy/(.*)$ /$1 break;
            proxy_pass http://gcs_auth_policy;
            proxy_http_version 1.1;
            proxy_read_timeout 60s;
            proxy_send_timeout 60s;
        }

        location /auth-policy/actuator/ {
            return 404;
        }

        location = /media-control/metrics {
            return 404;
        }

        location /media-control/ {
            rewrite ^/media-control/(.*)$ /$1 break;
            proxy_pass http://gcs_media_control;
            proxy_http_version 1.1;
            proxy_read_timeout 60s;
            proxy_send_timeout 60s;
        }

        location /api/control/ {
            add_header Deprecation "true" always;
            add_header X-GCS-Legacy-Fallback "disabled" always;
            return 410;
        }

        location /api/asset/ {
            rewrite ^/api/asset/(.*)$ /asset/$1 break;
            proxy_pass http://gcs_auth_policy;
            proxy_http_version 1.1;
            proxy_read_timeout 60s;
            proxy_send_timeout 60s;
        }

        location = /api/telemetry/all {
            proxy_pass http://gcs_auth_policy/telemetry/all;
            proxy_http_version 1.1;
            proxy_read_timeout 60s;
            proxy_send_timeout 60s;
        }

        location /api/telemetry/ {
            rewrite ^/api/telemetry/(.*)$ /telemetry/$1 break;
            proxy_pass http://gcs_auth_policy;
            proxy_http_version 1.1;
            proxy_read_timeout 60s;
            proxy_send_timeout 60s;
        }

        location = /api/ops/events/stream {
            proxy_pass http://gcs_auth_policy/ops/events/stream;
            proxy_http_version 1.1;
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 65s;
            proxy_send_timeout 65s;
            add_header Cache-Control no-cache always;
            add_header X-Accel-Buffering no always;
        }

        location /api/ops/ {
            rewrite ^/api/ops/(.*)$ /ops/$1 break;
            proxy_pass http://gcs_auth_policy;
            proxy_http_version 1.1;
            proxy_read_timeout 60s;
            proxy_send_timeout 60s;
        }

        location /api/stream/ {
            rewrite ^/api/stream/(.*)$ /stream/$1 break;
            proxy_pass http://gcs_media_control;
            proxy_http_version 1.1;
            proxy_read_timeout 60s;
            proxy_send_timeout 60s;
            add_header Deprecation "true" always;
            add_header X-GCS-Replacement-Route "/media-control/api/v1/streams" always;
        }

        location /stream/ {
            proxy_pass http://gcs_media_control;
            proxy_http_version 1.1;
            proxy_read_timeout 60s;
            proxy_send_timeout 60s;
            add_header Deprecation "true" always;
            add_header X-GCS-Replacement-Route "/media-control/api/v1/streams" always;
        }

        location /api/ {
            add_header Deprecation "true" always;
            add_header X-GCS-Legacy-Fallback "disabled" always;
            return 410;
        }

        location /ws/ {
            add_header Deprecation "true" always;
            add_header X-GCS-Legacy-Fallback "disabled" always;
            return 410;
        }

        location /hls/ {
            set $gcs_mediamtx_hls "mediamtx:8888";
            rewrite ^/hls/(.*)$ /$1 break;
            proxy_pass http://$gcs_mediamtx_hls;
            proxy_http_version 1.1;
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 30s;
            add_header Cache-Control no-cache always;
        }

        location /webrtc/ {
            set $gcs_mediamtx_webrtc "mediamtx:8889";
            rewrite ^/webrtc/(.*)$ /$1 break;
            proxy_pass http://$gcs_mediamtx_webrtc;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 3600s;
        }

        location / {
            proxy_pass http://gcs_dashboard;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
        }
    }
}
