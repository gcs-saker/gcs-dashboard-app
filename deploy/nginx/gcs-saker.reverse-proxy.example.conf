worker_processes auto;

events {
    worker_connections 4096;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65s;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        "" close;
    }

    upstream gcs_dashboard {
        server nginx:3000;
        keepalive 32;
    }

    upstream gcs_backend {
        server backend:8001;
        keepalive 32;
    }

    upstream gcs_mediamtx_hls {
        server mediamtx:8888;
        keepalive 16;
    }

    upstream gcs_mediamtx_webrtc {
        server mediamtx:8889;
        keepalive 16;
    }

    server {
        listen 80;
        server_name _;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    server {
        listen 443 ssl;
        http2 on;
        server_name _;

        ssl_certificate /etc/nginx/certs/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/privkey.pem;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1d;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers off;

        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy no-referrer-when-downgrade always;
        add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; media-src 'self' blob:; connect-src 'self' https: wss: stun: turn:;" always;
        add_header Permissions-Policy "camera=(self), microphone=(self), geolocation=(self)" always;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        location = /healthz {
            proxy_pass http://gcs_backend/healthz;
            proxy_http_version 1.1;
            proxy_read_timeout 10s;
            proxy_send_timeout 10s;
        }

        location = /readyz {
            proxy_pass http://gcs_backend/readyz;
            proxy_http_version 1.1;
            proxy_read_timeout 10s;
            proxy_send_timeout 10s;
        }

        location = /api/healthz {
            proxy_pass http://gcs_backend/healthz;
            proxy_http_version 1.1;
            proxy_read_timeout 10s;
            proxy_send_timeout 10s;
        }

        location = /api/readyz {
            proxy_pass http://gcs_backend/readyz;
            proxy_http_version 1.1;
            proxy_read_timeout 10s;
            proxy_send_timeout 10s;
        }

        location /api/auth/ {
            rewrite ^/api/auth/(.*)$ /auth/$1 break;
            proxy_pass http://gcs_backend;
            proxy_http_version 1.1;
            proxy_read_timeout 60s;
            proxy_send_timeout 60s;
        }

        location /api/control/ {
            rewrite ^/api/control/(.*)$ /control/$1 break;
            proxy_pass http://gcs_backend;
            proxy_http_version 1.1;
            proxy_read_timeout 60s;
            proxy_send_timeout 60s;
        }

        location /api/asset/ {
            rewrite ^/api/asset/(.*)$ /asset/$1 break;
            proxy_pass http://gcs_backend;
            proxy_http_version 1.1;
            proxy_read_timeout 60s;
            proxy_send_timeout 60s;
        }

        location /api/telemetry/ {
            rewrite ^/api/telemetry/(.*)$ /telemetry/$1 break;
            proxy_pass http://gcs_backend;
            proxy_http_version 1.1;
            proxy_read_timeout 60s;
            proxy_send_timeout 60s;
        }

        location /api/stream/ {
            rewrite ^/api/stream/(.*)$ /stream/$1 break;
            proxy_pass http://gcs_backend;
            proxy_http_version 1.1;
            proxy_read_timeout 60s;
            proxy_send_timeout 60s;
        }

        location /api/ {
            proxy_pass http://gcs_backend;
            proxy_http_version 1.1;
            proxy_read_timeout 60s;
            proxy_send_timeout 60s;
        }

        location /ws/ {
            proxy_pass http://gcs_backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        location /hls/ {
            rewrite ^/hls/(.*)$ /$1 break;
            proxy_pass http://gcs_mediamtx_hls;
            proxy_http_version 1.1;
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 30s;
            add_header Cache-Control no-cache always;
        }

        location /webrtc/ {
            rewrite ^/webrtc/(.*)$ /$1 break;
            proxy_pass http://gcs_mediamtx_webrtc;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 3600s;
        }

        location / {
            proxy_pass http://gcs_dashboard;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
        }
    }
}
