events {}

http {
    access_log off;

    server {
        listen 8080;

        location = /healthz {
            default_type application/json;
            return 200 '{"status":"ok","mode":"local-placeholder"}';
        }

        location / {
            default_type application/json;
            return 404 '{"detail":"mobile publisher is not available in local development"}';
        }
    }
}
