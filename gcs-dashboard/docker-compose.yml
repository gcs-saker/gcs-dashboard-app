name: ${COMPOSE_PROJECT_NAME:-gcs-saker-local}

x-env-files: &service_env_files
  - path: ./.env
    required: false
  - path: ../backend/.env
    required: false

services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: ${COMPOSE_PROJECT_NAME:-gcs-saker-local}-postgres
    env_file: *service_env_files
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-gcs_geo}
      POSTGRES_USER: ${POSTGRES_USER:-gcs_geo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "${LOCAL_BIND_ADDR:-127.0.0.1}:${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - type: bind
        source: ../deploy/postgres/init
        target: /docker-entrypoint-initdb.d
        read_only: true
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-gcs_geo} -d ${POSTGRES_DB:-gcs_geo}"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: always

  mqtt:
    image: eclipse-mosquitto:2
    container_name: ${COMPOSE_PROJECT_NAME:-gcs-saker-local}-mqtt
    command: ["mosquitto", "-c", "/mosquitto/config/mosquitto.conf"]
    environment:
      MQTT_HEALTH_USERNAME: ${MQTT_HEALTH_USERNAME:?Set MQTT_HEALTH_USERNAME in .env}
      MQTT_HEALTH_PASSWORD: ${MQTT_HEALTH_PASSWORD:?Set MQTT_HEALTH_PASSWORD in .env}
    ports:
      - "${LOCAL_BIND_ADDR:-127.0.0.1}:${MQTT_HOST_PORT:-1883}:1883"
    volumes:
      - type: bind
        source: ../deploy/mosquitto/mosquitto.hardened.conf
        target: /mosquitto/config/mosquitto.conf
        read_only: true
      - type: bind
        source: ../deploy/mosquitto/acl.hardened
        target: /mosquitto/config/acl
        read_only: true
      - type: bind
        source: ${MQTT_PASSWORD_FILE:?Set MQTT_PASSWORD_FILE in .env}
        target: /mosquitto/config/passwords
        read_only: true
      - mqtt-data:/mosquitto/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mosquitto_sub -h 127.0.0.1 -p 1883 -u \"$${MQTT_HEALTH_USERNAME}\" -P \"$${MQTT_HEALTH_PASSWORD}\" -t '$$SYS/broker/version' -C 1 -W 3 >/dev/null",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: always

  redis:
    image: redis:7.4.2-alpine
    container_name: ${COMPOSE_PROJECT_NAME:-gcs-saker-local}-redis
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" ping 2>/dev/null | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 20
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}
    restart: always

  backend:
    image: ${BACKEND_IMAGE:-gcs-saker-backend:local}
    build:
      context: ../backend
    container_name: ${COMPOSE_PROJECT_NAME:-gcs-saker-local}-backend
    env_file: *service_env_files
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in backend/.env or gcs-dashboard/.env}
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET:?Set AUTH_JWT_SECRET in backend/.env or gcs-dashboard/.env}
      AUTH_ACCESS_TOKEN_EXPIRE_MINUTES: ${AUTH_ACCESS_TOKEN_EXPIRE_MINUTES:-30}
      AUTH_REFRESH_TOKEN_EXPIRE_MINUTES: ${AUTH_REFRESH_TOKEN_EXPIRE_MINUTES:-10080}
      AUTH_REFRESH_COOKIE_SECURE: ${AUTH_REFRESH_COOKIE_SECURE:-false}
      AUTH_REFRESH_COOKIE_SAMESITE: ${AUTH_REFRESH_COOKIE_SAMESITE:-lax}
      AUTH_JWT_ISSUER: ${AUTH_JWT_ISSUER:-gcs-saker}
      BACKEND_CORS_ALLOW_ORIGINS: ${BACKEND_CORS_ALLOW_ORIGINS:-http://localhost:5173,http://localhost:5174}
      BACKEND_CONTENT_SECURITY_POLICY: ${BACKEND_CONTENT_SECURITY_POLICY:-}
      MQTT_HOST: ${MQTT_HOST:-mqtt}
      MQTT_PORT: ${MQTT_PORT:-1883}
      MQTT_CLIENT_ID: ${MQTT_CLIENT_ID:-gcs_backend_pub}
      MQTT_USERNAME: ${MQTT_USERNAME:?Set MQTT_USERNAME in .env}
      MQTT_PASSWORD: ${MQTT_PASSWORD:?Set MQTT_PASSWORD in .env}
      TELEMETRY_BUFFER_AUTO_FLUSH_MAX_ITEMS: ${TELEMETRY_BUFFER_AUTO_FLUSH_MAX_ITEMS:-1000}
      CONTROL_MESSAGE_SENDER: ${CONTROL_MESSAGE_SENDER:-mqtt}
      MEDIAMTX_PUBLIC_WEBRTC_BASE_URL: ${MEDIAMTX_PUBLIC_WEBRTC_BASE_URL:-http://localhost:8889}
      MEDIAMTX_PUBLIC_HLS_BASE_URL: ${MEDIAMTX_PUBLIC_HLS_BASE_URL:-http://localhost:8888}
      MEDIAMTX_API_BASE_URL: ${MEDIAMTX_API_BASE_URL:-http://mediamtx:9997}
      WEBRTC_STUN_URL: ${WEBRTC_STUN_URL:-stun:stun.l.google.com:19302}
      DASHBOARD_MAP_PROVIDER: ${DASHBOARD_MAP_PROVIDER:-esri-satellite}
      DASHBOARD_MAP_STYLE_URL: ${DASHBOARD_MAP_STYLE_URL:-https://services.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}}
      DASHBOARD_MAP_ATTRIBUTION: ${DASHBOARD_MAP_ATTRIBUTION:-Esri World Imagery}
      DASHBOARD_MAP_REQUIRES_API_KEY: ${DASHBOARD_MAP_REQUIRES_API_KEY:-false}
      WEBRTC_TURN_URL: ${WEBRTC_TURN_URL:-}
      WEBRTC_TURN_USERNAME: ${WEBRTC_TURN_USERNAME:-}
      WEBRTC_TURN_PASSWORD: ${WEBRTC_TURN_PASSWORD:-}
    ports:
      - "${LOCAL_BIND_ADDR:-127.0.0.1}:${BACKEND_HTTP_PORT:-8001}:8001"
    depends_on:
      postgres:
        condition: service_healthy
      mqtt:
        condition: service_healthy
    restart: always

  mediamtx:
    image: ${MEDIAMTX_IMAGE:-bluenviron/mediamtx:1.15.3}
    container_name: ${COMPOSE_PROJECT_NAME:-gcs-saker-local}-mediamtx
    env_file: *service_env_files
    environment:
      MTX_WEBRTCIPSFROMINTERFACES: ${MEDIAMTX_WEBRTC_IPS_FROM_INTERFACES:-true}
      MTX_WEBRTCADDITIONALHOSTS: ${MEDIAMTX_WEBRTC_ADDITIONAL_HOSTS:-127.0.0.1}
    ports:
      # Browser playback: WebRTC/WHEP primary, HLS fallback.
      - "${LOCAL_BIND_ADDR:-127.0.0.1}:${MEDIAMTX_WEBRTC_SIGNALING_PORT:-8889}:8889/tcp"
      - "${MEDIAMTX_ICE_BIND_ADDR:-127.0.0.1}:${MEDIAMTX_WEBRTC_ICE_UDP_PORT:-8189}:8189/udp"
      - "${MEDIAMTX_ICE_BIND_ADDR:-127.0.0.1}:${MEDIAMTX_WEBRTC_ICE_TCP_PORT:-8189}:8189/tcp"
      - "${LOCAL_BIND_ADDR:-127.0.0.1}:${MEDIAMTX_HLS_PORT:-8888}:8888/tcp"
      # Device ingest: RTSP/SRT are the preferred field-device inputs.
      - "${LOCAL_BIND_ADDR:-127.0.0.1}:${MEDIAMTX_RTSP_PORT:-8554}:8554/tcp"
      - "${MEDIAMTX_SRT_BIND_ADDR:-127.0.0.1}:${MEDIAMTX_SRT_PORT:-8890}:8890/udp"
      # Legacy fallback ingest. Limit this at firewall/reverse-proxy level if unused.
      - "${LOCAL_BIND_ADDR:-127.0.0.1}:${MEDIAMTX_RTMP_PORT:-1935}:1935/tcp"
    volumes:
      - type: bind
        source: ./mediamtx.yml
        target: /mediamtx.yml
        read_only: true
    command: /mediamtx.yml
    depends_on:
      media-control:
        condition: service_started
    restart: always

  media-control:
    image: ${MEDIA_CONTROL_IMAGE:-gcs-saker-media-control:local}
    build:
      context: ../services/media-control
    container_name: ${COMPOSE_PROJECT_NAME:-gcs-saker-local}-media-control
    env_file: *service_env_files
    environment:
      MEDIAMTX_API_BASE_URL: ${MEDIAMTX_API_BASE_URL:-http://mediamtx:9997}
      MEDIA_CONTROL_PUBLIC_WEBRTC_BASE_URL: ${MEDIA_CONTROL_PUBLIC_WEBRTC_BASE_URL:-/webrtc}
      MEDIA_CONTROL_PUBLIC_HLS_BASE_URL: ${MEDIA_CONTROL_PUBLIC_HLS_BASE_URL:-/hls}
      MEDIA_CONTROL_PUBLISH_TOKEN: ${MEDIA_CONTROL_PUBLISH_TOKEN:?Set MEDIA_CONTROL_PUBLISH_TOKEN in .env}
      MEDIA_CONTROL_AUTH_MODE: ${MEDIA_CONTROL_AUTH_MODE:-required}
      MEDIA_CONTROL_STUN_URL: ${MEDIA_CONTROL_STUN_URL:-stun:stun.l.google.com:19302}
      MEDIA_CONTROL_TURN_PRIMARY_URL: ${MEDIA_CONTROL_TURN_PRIMARY_URL:-turn:turn:3478?transport=udp}
      MEDIA_CONTROL_TURN_SECONDARY_URL: ${MEDIA_CONTROL_TURN_SECONDARY_URL:-turn:turn:3478?transport=tcp}
      MEDIA_CONTROL_TURN_MAX_HEALTHY_SERVERS: ${MEDIA_CONTROL_TURN_MAX_HEALTHY_SERVERS:-1}
      MEDIA_CONTROL_DEFAULT_PUBLISHER_GROUP_ID: ${MEDIA_CONTROL_DEFAULT_PUBLISHER_GROUP_ID:-co-a}
      MEDIA_CONTROL_STREAM_GROUP_MAP: ${MEDIA_CONTROL_STREAM_GROUP_MAP:-raw/local/webcam=co-a,raw/local/front=co-a,raw/local/rear=co-a}
      MEDIA_CONTROL_LISTEN_ADDR: :8081
      MEDIA_CONTROL_GRPC_LISTEN_ADDR: :9090
      MEDIA_CONTROL_GRPC_TOKEN: ${MEDIA_CONTROL_GRPC_TOKEN:-${MEDIA_CONTROL_PUBLISH_TOKEN:?Set MEDIA_CONTROL_PUBLISH_TOKEN in .env}}
      MEDIA_CONTROL_GRPC_MAX_PAYLOAD_BYTES: ${MEDIA_CONTROL_GRPC_MAX_PAYLOAD_BYTES:-65536}
      AUTH_POLICY_BASE_URL: ${AUTH_POLICY_BASE_URL:?Set AUTH_POLICY_BASE_URL in .env}
      MEDIA_CONTROL_REDIS_ADDR: ${MEDIA_CONTROL_REDIS_ADDR:-redis:6379}
      MEDIA_CONTROL_REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}
      TURN_USERNAME: ${WEBRTC_TURN_USERNAME:-gcs-turn}
      TURN_PASSWORD: ${WEBRTC_TURN_PASSWORD:-replace-with-secret-outside-git}
    depends_on:
      redis:
        condition: service_healthy
    restart: always

  turn:
    image: ${COTURN_IMAGE:-coturn/coturn:4.6.3}
    container_name: ${COMPOSE_PROJECT_NAME:-gcs-saker-local}-turn
    profiles: ["turn"]
    env_file: *service_env_files
    command:
      - -n
      - --log-file=stdout
      - --fingerprint
      - --lt-cred-mech
      - --realm=${TURN_REALM:-gcs-saker.local}
      - --user=${WEBRTC_TURN_USERNAME:-gcs-turn}:${WEBRTC_TURN_PASSWORD:-replace-with-secret-outside-git}
      - --listening-port=3478
      - --min-port=49160
      - --max-port=49200
      - --external-ip=${TURN_EXTERNAL_IP:-127.0.0.1}
      - --no-cli
    ports:
      - "${TURN_BIND_ADDR:-0.0.0.0}:${TURN_PORT:-3478}:3478/tcp"
      - "${TURN_BIND_ADDR:-0.0.0.0}:${TURN_PORT:-3478}:3478/udp"
      - "${TURN_BIND_ADDR:-0.0.0.0}:49160-49200:49160-49200/udp"
    restart: always

  nginx:
    image: ${DASHBOARD_IMAGE:-gcs-saker-dashboard:local}
    build:
      context: .
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api}
        VITE_IDENTITY_API_BASE_URL: ${VITE_AUTH_API_BASE_URL:-/auth-policy/auth}
        VITE_STREAM_API_BASE_URL: ${VITE_STREAM_API_BASE_URL:-/media-control}
        VITE_HLS_BASE_URL: ${VITE_HLS_BASE_URL:-/hls}
        VITE_DEFAULT_STREAM_ID: ${VITE_DEFAULT_STREAM_ID:-CID001}
        VITE_LOCAL_WEBCAM_WHIP_URL: ${VITE_LOCAL_WEBCAM_WHIP_URL:-https://localhost/webrtc/raw/local/webcam/whip}
        VITE_WEBRTC_STUN_URL: ${VITE_WEBRTC_STUN_URL:-stun:stun.l.google.com:19302}
        VITE_MAP_PROVIDER: ${VITE_MAP_PROVIDER:-esri-satellite}
        VITE_MAP_STYLE_URL: ${VITE_MAP_STYLE_URL:-https://services.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}}
    container_name: ${COMPOSE_PROJECT_NAME:-gcs-saker-local}-dashboard
    env_file: *service_env_files
    ports:
      - "${LOCAL_BIND_ADDR:-127.0.0.1}:${DASHBOARD_HTTP_PORT:-3000}:3000"
    depends_on:
      backend:
        condition: service_started
      mediamtx:
        condition: service_started
    restart: always

  edge:
    image: nginx:1.29-alpine
    container_name: ${COMPOSE_PROJECT_NAME:-gcs-saker-local}-edge
    ports:
      - "${PUBLIC_HTTP_BIND_ADDR:-127.0.0.1}:${PUBLIC_HTTP_PORT:-80}:80"
      - "${PUBLIC_HTTPS_BIND_ADDR:-0.0.0.0}:${PUBLIC_HTTPS_PORT:-443}:443"
    volumes:
      - type: bind
        source: ../deploy/nginx/gcs-saker.reverse-proxy.example.conf
        target: /etc/nginx/nginx.conf
        read_only: true
      - type: bind
        source: ${NGINX_CERTS_DIR:-./certs}
        target: /etc/nginx/certs
        read_only: true
    depends_on:
      backend:
        condition: service_started
      mediamtx:
        condition: service_started
      nginx:
        condition: service_started
    restart: always

volumes:
  postgres-data:
  mqtt-data:
  redis-data:
