services:
  mqtt:
    profiles: ["local-mqtt-no-auth"]
    command: ["mosquitto", "-c", "/mosquitto-no-auth.conf"]
    ports:
      - "${LOCAL_BIND_ADDR:-127.0.0.1}:${MQTT_HOST_PORT:-1883}:1883"
    healthcheck:
      test: ["CMD-SHELL", "mosquitto_sub -h 127.0.0.1 -p 1883 -t '$$SYS/broker/version' -C 1 -W 3 >/dev/null"]
  media-control:
    environment:
      MEDIA_CONTROL_GRPC_ALLOW_PLAINTEXT: "true"
      MQTT_GATEWAY_URL: tcp://mqtt:1883
      MQTT_GATEWAY_ALLOW_PLAINTEXT: "true"
      MQTT_GATEWAY_USERNAME: local-smoke-only
      MQTT_GATEWAY_PASSWORD: local-smoke-only
      MQTT_GATEWAY_CA_FILE: ""
      MQTT_GATEWAY_CERT_FILE: ""
      MQTT_GATEWAY_KEY_FILE: ""
      MQTT_GATEWAY_SERVER_NAME: ""
  backend:
    environment:
      MEDIA_CONTROL_GRPC_ALLOW_PLAINTEXT: "true"
