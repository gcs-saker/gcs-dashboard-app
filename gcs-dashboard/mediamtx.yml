logLevel: info

# 관리용 API는 Docker 내부 네트워크에서만 사용한다. 호스트/public 포트로는 노출하지 않는다.
api: true
apiAddress: :9997
metrics: false
metricsAddress: 127.0.0.1:9998

# Publish와 playback은 media-control HTTP auth hook에서 토큰을 확인한다.
authMethod: http
authHTTPAddress: http://media-control:8081/v1/mediamtx/auth
authHTTPExclude:
  - action: api
  - action: metrics
  - action: pprof

# MediaMTX 관리 API는 Docker 내부 네트워크에서만 허용한다.
authInternalUsers:
  - user: any
    pass:
    ips: ['127.0.0.1', '::1', '172.16.0.0/12']
    permissions:
      - action: api

# Ingest protocols
rtsp: true
rtspTransports: [tcp, udp]
rtspAddress: :8554
rtpAddress: :8000
rtcpAddress: :8001

rtmp: true
rtmpAddress: :1935

srt: true
srtAddress: :8890

# Playback protocols
hls: true
hlsAddress: :8888
hlsVariant: lowLatency
hlsAllowOrigin: '*'

webrtc: true
webrtcAddress: :8889
webrtcAllowOrigin: '*'
webrtcLocalUDPAddress: :8189
webrtcLocalTCPAddress: :8189
webrtcIPsFromInterfaces: true
webrtcAdditionalHosts: []
# Local STUN keeps closed-network deployments independent from public internet.
webrtcICEServers2:
  - url: stun:stun.l.google.com:19302
    clientOnly: true
webrtcSTUNGatherTimeout: 5s

paths:
  all:
    source: publisher
