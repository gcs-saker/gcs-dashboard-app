schemaVersion: gcs-saker-runtime-stack-status-v1
updatedAt: "2026-06-26"
statusLegend:
  active: "기본 compose와 edge route에서 실제 런타임 경로로 사용한다."
  profile: "선택 compose profile 또는 override로 실행 가능해야 하며, 기본 런타임은 아니다."
  runtime-validated-profile: "선택 compose profile 또는 override가 실제 격리 runtime smoke를 통과했지만 기본 런타임은 아니다."
  synthetic-benchmarked: "실제 운영 DB capacity claim은 아니지만, 코드 경로와 statement 감소 효과가 재현 가능한 synthetic benchmark를 통과했다."
  contract: "프로토콜, DTO, 테스트 계약은 있으나 실제 네트워크 런타임 연결은 완료되지 않았다."
  prototype: "브라우저/서비스 feature detection 또는 후보 구현 단계다."
  deferred: "설계 후보로 남겨두되 현재 구현 완료 범위에 포함하지 않는다."

stacks:
  springAuthPolicy:
    status: active
    issue: 411
    runtime:
      composeService: auth-policy
      ingressRoutes:
        - /auth-policy/
        - /healthz
        - /readyz
        - /api/telemetry/
        - /api/ops/
    evidence:
      - services/auth-policy/build.gradle.kts
      - deploy/compose/compose.single-node.poc.yml
      - deploy/nginx/single-node.poc.conf
      - services/auth-policy/src/test/kotlin
    nextGate: "운영 서버 배포 후 auth-policy health, login, refresh session, GraphQL/REST contract smoke를 재실행한다."

  goMediaControl:
    status: active
    issue: 411
    runtime:
      composeService: media-control
      ingressRoutes:
        - /media-control/
        - /api/stream/
    evidence:
      - services/media-control/internal/httpapi/server.go
      - services/media-control/internal/domain
      - services/media-control/internal/streamcache
      - deploy/compose/compose.single-node.poc.yml
    nextGate: "stream list, ICE server list, playback URL, unauthorized access contract를 실제 edge 경로로 검증한다."

  redisCache:
    status: active
    issue: 411
    runtime:
      composeService: redis
    evidence:
      - services/auth-policy/src/main/kotlin/kr/co/a4ai/gcssaker/authpolicy/infrastructure/redis/RedisRefreshSessionStore.kt
      - services/media-control/internal/streamcache
      - deploy/compose/compose.single-node.poc.yml
    nextGate: "Redis 장애 시 auth-policy와 media-control의 degraded behavior를 smoke test로 고정한다."

  postgresPrimaryStore:
    status: active
    issue: 414
    runtime:
      composeService: postgres-geo
      protocol: "PostgreSQL wire protocol with PostGIS geometry extension"
    evidence:
      - deploy/compose/compose.single-node.poc.yml
      - services/auth-policy/src/main/kotlin/kr/co/a4ai/gcssaker/authpolicy/infrastructure
      - deploy/postgres/init/001_geo_telemetry.sql
      - backend/tests/test_postgis_schema_contract.py
      - scripts/smoke/postgis_runtime_smoke.py
    activeRuntime:
      - "stream telemetry history append"
      - "stream telemetry latest upsert"
      - "selected stream latest read"
      - "bounded viewport query with EXPLAIN (ANALYZE, BUFFERS, FORMAT JSON)"
    nextGate: "auth/user/ops 전체 cutover runbook과 production backup/restore drill을 PostgreSQL 기준으로 재검증한다."

  telemetryBulkPersistence:
    status: synthetic-benchmarked
    issue: 417
    runtime:
      primaryStore: postgresPrimaryStore
      legacyStore: "MySQL/MariaDB latest table compatibility"
    evidence:
      - backend/modules/telemetry_buffer
      - backend/tests/test_telemetry_write_buffer.py
      - backend/tests/test_telemetry_bulk_flush_benchmark.py
      - scripts/benchmarks/telemetry_bulk_flush_benchmark.py
      - docs/architecture/GCS-Saker_telemetry_storage_bulk_write_contract.md
    runtimeProof:
      - "latest overwrite and history append are separated before persistence."
      - "PostgreSQL flush uses latest bulk upsert plus history bulk insert."
      - "MySQL/MariaDB legacy flush uses latest bulk ON DUPLICATE KEY UPDATE instead of record loop."
      - "Redis/DragonFly queue restore policy preserves drained record order on failure."
      - "synthetic benchmark records ingest throughput, flush latency, statement count, and avoided statement count."
    nextGate: "live DB-backed benchmark에서 batch size별 lock 영향, WAL/redo 영향, 실제 flush latency를 측정한다."

  mediamtxWebrtcHls:
    status: active
    issue: 418
    runtime:
      composeService: mediamtx
      ingressRoutes:
        - /webrtc/
        - /hls/
    evidence:
      - deploy/mediamtx/mediamtx.closed-network.yml
      - deploy/nginx/single-node.poc.conf
      - scripts/smoke/m7_publish_play_smoke.sh
      - scripts/smoke/m7_dashboard_first_frame_smoke.sh
      - scripts/smoke/webrtc_ice_smoke.py
    nextGate: "외부 NAT에서 WHIP publish, WHEP play, first frame, audio stats를 자동 smoke로 재검증한다."

  coturnPair:
    status: active
    issue: 418
    runtime:
      composeServices:
        - turn-primary
        - turn-secondary
    evidence:
      - deploy/compose/compose.single-node.poc.yml
      - scripts/smoke/webrtc_ice_smoke.py
      - services/media-control/internal/turn
      - docs/operations/GCS-Saker_M7_ICE_관측과_TURN_부하절감_가이드.md
    runtimeProof:
      - "selected ICE pair에서 local/remote candidate type, protocol, RTT, direct/relay path를 추출한다."
      - "benchmark schema가 selected candidate type, ICE RTT, direct ratio, relay ratio, relay fallback reason을 고정한다."
      - "media-control은 STUN 후보를 유지하고 건강한 TURN 후보를 기본 1개로 제한한다."
      - "primary TURN이 unhealthy면 secondary TURN이 fallback으로 반환되는 테스트가 있다."
    nextGate: "relay ratio가 높은 stream에 bitrate/fps downshift와 TURN capacity alert를 연결한다."

  mqttTelemetryBridge:
    status: active
    issue: 416
    runtime:
      composeService: mqtt
      composeFile: deploy/compose/compose.single-node.poc.yml
    evidence:
      - scripts/smoke/mqtt_hardened_profile_smoke.py
      - backend/tests/test_mqtt_hardened_profile_smoke_contract.py
      - backend/tests/test_mqtt_consumer_bridge.py
      - deploy/mosquitto/mosquitto.hardened.conf
      - deploy/mosquitto/acl.hardened
      - services/auth-policy/src/main/kotlin/kr/co/a4ai/gcssaker/authpolicy/application/MqttTelemetryConsumerBridge.kt
    runtimeProof:
      - "default single-node compose config is validated with the hardened MQTT service in an isolated project."
      - "anonymous MQTT access is rejected."
      - "device gateway protobuf telemetry publish reaches backend subscriber."
      - "backend command publish reaches device gateway subscriber."
      - "MQTT carries telemetry/control data only; media frames stay on MediaMTX WebRTC/HLS."
    nextGate: "운영 승격 전 broker credential rotation, device gateway packaging, multi-minute soak를 추가한다."

  protobufInternalContracts:
    status: contract
    issue: 413
    evidence:
      - contracts/proto/gcs/saker/v1/common.proto
      - contracts/proto/gcs/saker/v1/telemetry.proto
      - contracts/proto/gcs/saker/v1/stream_control.proto
      - contracts/proto/gcs/saker/v1/ops_event.proto
      - contracts/proto/gcs/saker/v1/ai_overlay.proto
      - backend/tests/test_protobuf_contracts.py
      - backend/modules/protocol_v2/gateway_service.py
      - services/media-control/internal/protocolv2
      - services/auth-policy/src/main/kotlin/kr/co/a4ai/gcssaker/authpolicy/protocol/v2
    nextGate: "명시 mapper와 runtime smoke는 추가되었다. 다음은 generated DTO plugin pinning과 장시간 staging soak를 별도 hardening으로 진행한다."

  grpcInternalStreaming:
    status: active
    issue: 472
    runtime:
      composeService: media-control
      internalPort: 9090
      protocol: "gRPC bidirectional streaming over protobuf payload"
    evidence:
      - contracts/proto/gcs/saker/v1/gateway_service.proto
      - backend/modules/messaging/sender.py
      - backend/modules/protocol_v2/gateway_service.py
      - backend/tests/test_message_sender_abstraction.py
      - backend/tests/test_protocol_v2_gateway_service.py
      - services/media-control/internal/grpcgateway
      - scripts/smoke/grpc_runtime_smoke.py
    activeRuntime:
      - "client implementation behind MessageSender abstraction"
      - "CONTROL_GRPC_TARGET and CONTROL_GRPC_METHOD runtime configuration"
      - "media-control internal SakerGatewayService.Exchange endpoint"
      - "explicit GatewayStreamRequest/GatewayStreamResponse mappers in Python and Go"
      - "compose internal Exchange smoke with multi-message bidi stream"
      - "metadata authorization, malformed payload, backpressure, reconnect tests"
    nextGate: "generated DTO plugin을 버전 고정해 explicit mapper를 대체하고, 장시간 staging soak와 native gateway packaging을 진행한다."

  dragonflyCacheProfile:
    status: profile
    issue: 415
    runtime:
      overrideFile: deploy/compose/compose.dragonfly.override.yml
      replacedService: redis
      protocol: "Redis RESP-compatible cache protocol"
      defaultRuntime: false
    evidence:
      - deploy/compose/compose.dragonfly.override.yml
      - backend/tests/test_docker_env_contract.py
      - backend/tests/test_dragonfly_cache_profile_contract.py
      - scripts/smoke/dragonfly_profile_smoke.py
      - docs/architecture/GCS-Saker_M8_dragonfly_compatibility_profile.md
    activeProfile:
      - "Redis 기본 profile과 DragonFly override profile이 같은 AUTH/PING/SETEX/GET/GETDEL/TTL/DEL command subset을 통과한다."
      - "auth-policy principal cache, refresh session, media-control ICE cache, stream list, stream presence key 계약을 검증한다."
      - "DragonFly license는 BSL 1.1로 기록하고, managed in-memory data-store service로 제공하지 않는 self-hosted production 조건을 운영 리스크로 남긴다."
      - "profile remains optional until benchmark and operational risk review approve DragonFly promotion."
    nextGate: "Redis 기본 runtime을 DragonFly로 교체하기 전 production benchmark, 장애 drill, 운영 리스크 승인을 별도 gate로 진행한다."

  closedNetworkApplianceProfile:
    status: contract
    issue: 420
    evidence:
      - deploy/compose/.env.closed-network.example
      - deploy/compose/.env.mixed-network.example
      - deploy/compose/.env.public-ice.example
      - deploy/compose/compose.single-node.poc.yml
      - scripts/gates/closed_network_static_check.py
      - backend/tests/test_closed_network_static_check.py
      - docs/operations/GCS-Saker_Closed_Network_Profile_Runbook_v0.1.md
    runtimeProof:
      - "closed, mixed, public network profile env template이 분리되어 있다."
      - "closed profile은 offline map, internal STUN/TURN, internal time source를 사용한다."
      - "closed profile compose config가 Docker Compose에서 해석된다."
      - "offline artifact runbook은 image tarball, checksum, dependency cache, runtime offline install, rollback을 포함한다."
    missingRuntime:
      - "actual air-gapped appliance install rehearsal"
      - "local STUN/TURN media smoke with external DNS blocked"
    nextGate: "실제 폐쇄망 또는 외부 차단 네트워크에서 image load, compose up, WHIP/WHEP, internal time drift smoke를 수행한다."

  graphqlOperationalRead:
    status: contract
    issue: 421
    runtime:
      composeService: auth-policy
    evidence:
      - services/auth-policy/src/main/resources/graphql/schema.graphqls
      - services/auth-policy/src/main/kotlin/kr/co/a4ai/gcssaker/authpolicy/api/operations/events/OperationalEventGraphQlController.kt
      - services/auth-policy/src/test/kotlin/kr/co/a4ai/gcssaker/authpolicy/api/OperationalEventGraphQlControllerTest.kt
    missingRuntime:
      - "edge /graphql route"
      - "dashboard GraphQL client integration"
      - "large read model selection rule"
    nextGate: "Dashboard 주 통신은 REST/JSON으로 유지하되, 큰 read model만 GraphQL로 넘길지 결정하고 edge route를 추가한 뒤 active로 승격한다."

  webCodecsCanvasPipeline:
    status: prototype
    issue: 419
    evidence:
      - gcs-dashboard/src/features/streaming/runtime/webCodecsSupport.ts
      - gcs-dashboard/src/features/streaming/runtime/webCodecsSupport.test.ts
      - gcs-dashboard/src/features/streaming/runtime/webCodecsPipelinePlan.ts
      - gcs-dashboard/src/features/streaming/runtime/webCodecsPipelinePlan.test.ts
    missingRuntime:
      - "worker pipeline"
      - "HLS fallback frame processing"
      - "recording writer"
      - "AI overlay frame synchronization"
    nextGate: "feature detection에서 끝내지 않고 WebCodecs unavailable fallback, worker init, frame metadata contract를 테스트한다."

  http3EdgeProfile:
    status: deferred
    issue: 421
    evidence:
      - docs/architecture/GCS-Saker_M8_local_protocol_migration_plan.md
    nextGate: "Nginx/edge 대체 후보와 인증서/폐쇄망 CA 전략이 정해진 뒤 별도 profile로 검증한다."

  aiOverlaySidecar:
    status: contract
    issue: 419
    evidence:
      - contracts/proto/gcs/saker/v1/ai_overlay.proto
      - backend/modules/protocol_v2/ai_overlay.py
      - backend/tests/test_ai_overlay_protocol.py
      - backend/tests/test_ai_overlay_sidecar_smoke.py
      - scripts/smoke/ai_overlay_sidecar_smoke.py
      - docs/architecture/GCS-Saker_M8_local_protocol_migration_plan.md
      - docs/architecture/GCS-Saker_M8_ai_sidecar_overlay_contract.md
    runtimeProof:
      - "mock AI detection response가 AiOverlayEvent protobuf metadata로 변환된다."
      - "AiOverlayEvent protobuf metadata가 dashboard JSON DTO로 복원된다."
      - "AI sidecar path는 media frame, video chunk, audio bytes를 운반하지 않는다."
      - "stream id가 다른 overlay event는 dashboard delivery에서 거부된다."
    nextGate: "FastAPI sidecar process 분리, broker publish adapter, dashboard Canvas overlay renderer를 추가한다."
