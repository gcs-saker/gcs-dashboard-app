schemaVersion: gcs-saker-v2-completion-matrix-v1
updatedAt: "2026-06-19"
releaseName: "Saker v2"
releaseReadiness: alpha-core
trackerIssue: 411
releaseGateIssue: 423
definition:
  alpha-core: "active core runtime과 검증 체계는 잡혔지만 production-ready release는 아니다."
  release-candidate: "모든 release blocker가 닫히고 local/server smoke와 benchmark가 통과한 상태다."
  production-ready: "운영 서버 배포 후 health/route/stream/degraded/external NAT 검증까지 완료된 상태다."
decision: "현재 상태는 Saker v2 alpha-core이며, production-ready complete가 아니다."

