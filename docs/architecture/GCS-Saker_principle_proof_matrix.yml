  - id: STREAM-RECONNECT-001
    group: streaming-low-latency
    principle: "stream disconnect/reconnect 상태를 UI에 반영한다."
    expectedProof: "frontend reconnect policy와 failure smoke scenario가 재연결 상태를 테스트한다."
