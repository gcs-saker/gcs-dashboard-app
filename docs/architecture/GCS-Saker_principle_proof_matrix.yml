    group: streaming-low-latency
    principle: "ICE candidate type, relay ratio, RTT, first frame latency, WHEP response time을 관측한다."
    expectedProof: "dashboard DOM data attributes, operational event metrics, performance matrix가 관측 지표를 고정한다."
