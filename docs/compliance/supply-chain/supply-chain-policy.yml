schemaVersion: gcs-saker.supply-chain-policy.v1
requirements:
  lockfilesRequired: true
  containerBaseDigestRequired: true
  sbomFormats: [SPDX-JSON]
  vulnerabilityGate: Critical and supported fix-available High findings block release
  eolRuntimeBlocked: true
  unusedDependencyRemovalRequired: true
  imageSignature: KEYLESS_COSIGN_VERIFIED
  sbomSignature: GITHUB_ATTESTATION_VERIFIED
  provenance: SLSA_ATTESTATION_VERIFIED
  vex: REQUIRED_FOR_EVERY_EXCEPTION
  licenseDecision: ALLOWLIST_REQUIRED
  licenseScanner: AUDIT_IMPLEMENTED_ENFORCEMENT_BLOCKED
  thirdPartyNotices: GENERATED_NOT_APPROVED
allowedLicenses: [Apache-2.0, BSD-2-Clause, BSD-3-Clause, ISC, MIT, MPL-2.0, Python-2.0]
reviewRequiredLicenses: [LGPL-2.1-only, LGPL-2.1-or-later, LGPL-3.0-only, LGPL-3.0-or-later]
deniedLicenses: [AGPL-3.0-only, AGPL-3.0-or-later, SSPL-1.0, BUSL-1.1, UNKNOWN]
firstPartyPurlPrefixes:
  - pkg:golang/github.com/gcs-saker/gcs-dashboard-app/
  - pkg:maven/org.springframework.boot.loader.launch.JarLauncher/auth-policy@
artifacts:
  - id: backend-image
    sbom: IMPLEMENTED
    signature: VERIFIED
    provenance: VERIFIED
  - id: auth-policy-image
    sbom: IMPLEMENTED
    signature: VERIFIED
    provenance: VERIFIED
  - id: media-control-image
    sbom: IMPLEMENTED
    signature: VERIFIED
    provenance: VERIFIED
  - id: dashboard-image
    sbom: IMPLEMENTED
    signature: VERIFIED
    provenance: VERIFIED
