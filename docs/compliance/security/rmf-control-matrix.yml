schemaVersion: gcs-saker.rmf-control-matrix.v1
baseline: NIST SP 800-53 Rev.5 tailored software baseline
assessmentMethod: NIST SP 800-53A Rev.5
cciMappingStatus: BLOCKED_OFFICIAL_ASD_STIG_XCCDF_NOT_RETAINED
controls:
  - id: AC-2
    family: Access Control
    implementation: Auth-policy owns named accounts, active state, roles, groups, security version, and session revocation.
    assessment: Inspect account lifecycle tests and exercise disable, role change, group change, and refresh replay.
    evidence: [services/auth-policy/src/test/kotlin/kr/co/a4ai/gcssaker/authpolicy/domain/AuthSessionServiceTest.kt]
    status: IMPLEMENTED_NOT_ASSESSED
  - id: AC-3
    family: Access Control
    implementation: Resource authorization combines role, server-owned group scope, stream identity, and active session.
    assessment: Exercise same-group success and descendant, sibling, inactive, stale-session, and malformed denials.
    evidence: [services/auth-policy/src/test/kotlin/kr/co/a4ai/gcssaker/authpolicy/domain/HierarchicalAuthorizationContractTest.kt]
    status: IMPLEMENTED_NOT_ASSESSED
  - id: AU-2
    family: Audit and Accountability
    implementation: Security-relevant identity, group, stream, Talkback, and operational events use stable event categories.
    assessment: Inspect event taxonomy, redaction, authorized reads, persistence, and failure behavior.
    evidence: [services/auth-policy/src/test/kotlin/kr/co/a4ai/gcssaker/authpolicy/OperationalAuditPublisherTest.kt]
    status: OPEN
    integrityPolicy: docs/compliance/security/audit-integrity-policy.yml
  - id: IA-2
    family: Identification and Authentication
    implementation: Users authenticate with named credentials and signed short-lived access and rotating refresh tokens.
    assessment: Verify MFA gap, token algorithms, expiration, replay, revocation, and inactive-account behavior.
    evidence: [services/auth-policy/src/test/kotlin/kr/co/a4ai/gcssaker/authpolicy/domain/AuthSessionServiceTest.kt]
    status: OPEN
  - id: SC-2
    family: System and Communications Protection
    implementation: Browser presentation, policy services, media routing, persistence, and management routes have separate owners and network boundaries.
    assessment: Inspect public routes and verify databases, brokers, metrics, reflection, and management interfaces remain private.
    evidence: [scripts/gates/closed_network_static_check.py]
    status: IMPLEMENTED_NOT_ASSESSED
  - id: SC-8
    family: System and Communications Protection
    implementation: Public ingress uses TLS and WebRTC media uses DTLS-SRTP.
    assessment: Verify internal gRPC, MQTT, database, Redis, TURN, certificate, and cipher gaps.
    evidence: [scripts/ops/check_public_tls.sh]
    status: OPEN
  - id: SI-2
    family: System and Information Integrity
    implementation: CI audits dependencies and scans runtime images with time-bounded vulnerability exceptions.
    assessment: Review remediation SLA, exception authorization, update delivery, and affected-release notification.
    evidence: [.github/workflows/ci.yml]
    status: IMPLEMENTED_NOT_ASSESSED
  - id: SA-11
    family: System and Services Acquisition
    implementation: Formatting, type checking, unit/integration tests, authorization denials, builds, browser smoke, and image scans block release.
    assessment: Sample a release and reproduce every required check from the immutable source revision.
    evidence: [.github/workflows/ci.yml]
    status: IMPLEMENTED_NOT_ASSESSED
  - id: SA-15
    family: System and Services Acquisition
    implementation: Secure Development Plan defines design, code, review, test, incident, and evidence obligations.
    assessment: Inspect a security-sensitive pull request for complete impact and review evidence.
    evidence: [docs/compliance/security/secure-development-plan.md]
    status: IMPLEMENTED_NOT_ASSESSED
  - id: SR-4
    family: Supply Chain Risk Management
    implementation: Lockfiles, exact versions, base-image digests, SBOM generation, dependency audits, and image scans are required.
    assessment: Verify artifact signatures, VEX, provenance, license policy, and supplier review gaps.
    evidence: [.github/workflows/ci.yml]
    status: OPEN
  - id: AC-12
    family: Access Control
    implementation: Explicit logout and bounded access/refresh tokens exist; STIG idle-session limits are not implemented.
    assessment: Verify logout and token expiry, then test 10-minute admin and 15-minute user idle termination.
    evidence: [services/auth-policy/src/test/kotlin/kr/co/a4ai/gcssaker/authpolicy/domain/AuthSessionServiceTest.kt]
    status: OPEN
  - id: AU-3
    family: Audit and Accountability
    implementation: Security events carry UTC time, stable action/category, result, and authenticated or redacted process identity.
    assessment: Sample login, account, stream, Talkback, and denial records and verify every required field and redaction.
    evidence: [services/auth-policy/src/main/kotlin/kr/co/a4ai/gcssaker/authpolicy/application/SecurityAuditEventFactory.kt]
    status: IMPLEMENTED_NOT_ASSESSED
  - id: AU-5
    family: Audit and Accountability
    implementation: Audit failures are recorded, but a 75-percent volume warning is not demonstrated.
    assessment: Fill an isolated audit volume past 75 percent and verify immediate SA/ISSO notification without losing records.
    evidence: [docs/compliance/security/poam.yml]
    status: OPEN
  - id: SC-13
    family: System and Communications Protection
    implementation: Public TLS and internal mTLS profiles define protocol floors, identities, rotation, and plaintext denial.
    assessment: Execute cipher, SAN, missing-client-certificate, revoked-certificate, and plaintext denial tests.
    evidence: [scripts/ops/check_secure_channels.sh, scripts/ops/check_internal_pki.sh]
    status: IMPLEMENTED_NOT_DEPLOYED
  - id: CA-2
    family: Assessment, Authorization, and Monitoring
    implementation: The ASD STIG assessment overlay binds conservative verdicts to NIST controls and repository evidence.
    assessment: Obtain the official V6R4 XCCDF/data stream, verify its hash, restore CCI mappings, and review every Open verdict.
    evidence: [docs/compliance/security/asd-stig-v6r4-assessment.yml]
    status: OPEN
