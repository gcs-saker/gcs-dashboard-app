schemaVersion: gcs-saker.poam.v1
updatedAt: 2026-09-22
items:
  - id: POAM-SEC-001
    weakness: Internal service channels do not all provide mutually authenticated encryption.
    controls: [SC-8]
    issue: https://github.com/gcs-saker/gcs-dashboard-app/issues/662
    severity: HIGH
    mitigation: Keep services private and authenticate application requests while mTLS is implemented.
    dueBy: 2026-10-31
    status: OPEN
  - id: POAM-SEC-002
    weakness: System Administrator authentication does not require a second factor.
    controls: [IA-2]
    issue: https://github.com/gcs-saker/gcs-dashboard-app/issues/662
    severity: HIGH
    mitigation: Restrict production administration and retain complete privileged audit events.
    dueBy: 2026-10-31
    status: OPEN
  - id: POAM-SEC-003
    weakness: Release images, SBOMs, and provenance lacked independently verified signatures.
    controls: [SR-4]
    issue: https://github.com/gcs-saker/gcs-dashboard-app/issues/663
    severity: MEDIUM
    mitigation: Signed release workflow now binds immutable digests, SPDX SBOMs, SLSA provenance, licenses, and source CI.
    dueBy: 2026-11-30
    status: CLOSED
    closedAt: 2026-09-21
    evidence: [docs/compliance/evidence/signed-release-2026-09-08.md, docs/releases/GCS-Saker_5cd2244c_release_candidate.md]
  - id: POAM-SEC-004
    weakness: Audit anchors are tamper-evident, but independent WORM retention is not deployed.
    controls: [AU-2]
    issue: https://github.com/gcs-saker/gcs-dashboard-app/issues/664
    severity: MEDIUM
    mitigation: Verify hash chains and off-load/restore drills while independent WORM retention remains pending.
    dueBy: 2026-11-30
    status: OPEN
  - id: POAM-SEC-005
    weakness: Administrator and non-privileged browser sessions do not enforce the STIG idle limits.
    controls: [AC-12]
    issue: https://github.com/gcs-saker/gcs-dashboard-app/issues/656
    severity: MEDIUM
    mitigation: Access and refresh token limits, explicit logout, and administrator MFA reduce exposure pending idle enforcement.
    dueBy: 2026-10-15
    status: OPEN
  - id: POAM-SEC-006
    weakness: Audit off-load and the 75 percent storage warning lack production evidence.
    controls: [AU-4, AU-5, AU-9]
    issue: https://github.com/gcs-saker/gcs-dashboard-app/issues/664
    severity: MEDIUM
    mitigation: Use the distinct-device read-only anchor off-load and signed recovery verifier pending actual external/WORM deployment evidence.
    dueBy: 2026-11-30
    status: OPEN
  - id: POAM-SEC-007
    weakness: The retained ASD STIG V6R4 extraction omits authoritative CCI identifiers.
    controls: [CA-2, CA-7]
    issue: https://github.com/gcs-saker/gcs-dashboard-app/issues/656
    severity: MEDIUM
    mitigation: Preserve NIST mappings and block CCI claims until the official XCCDF or data stream is retained and hash-verified.
    dueBy: 2026-10-15
    status: OPEN
  - id: POAM-SEC-008
    weakness: Internal DAST evidence is retained, but independent penetration execution is not complete.
    controls: [CA-8, SA-11]
    issue: https://github.com/gcs-saker/gcs-dashboard-app/issues/665
    severity: HIGH
    mitigation: Continue disposable-target DAST and commission an independent penetration retest before delivery qualification.
    dueBy: 2026-10-31
    status: OPEN
