schemaVersion: gcs-saker.server01-secret-exposure.v1
scope: server01-production
pkiSource: owner-only host directory
wholeDirectoryMountAllowed: false
services:
  postgres-geo: [postgres.crt, postgres.key]
  redis: [ca.crt, redis.crt, redis.key]
  mqtt: [ca.crt, ca.crl, mqtt.crt, mqtt.key, mqtt-health.crt, mqtt-health.key]
  backend: [ca.crt, backend.crt, backend.key]
  auth-policy: [ca.crt, auth-policy.crt, auth-policy.key]
  media-control: [ca.crt, media-control.crt, media-control.key]
  turn-primary: [turn-primary.crt, turn-primary.key]
  turn-secondary: [turn-secondary.crt, turn-secondary.key]
passwordAndTokenDelivery:
  status: PARTIAL_FILE_MIGRATION
  owner: issue-881-phase-2
  migrated: [AUTH_JWT_SECRET]
  pending:
    - database and Redis passwords
    - internal RPC and audit ingestion tokens
    - TURN and MediaMTX shared credentials
    - bootstrap, operator, smoke, and MFA secrets
  requirements:
    - application boundaries accept named file inputs without logging contents
    - environment and file inputs cannot be configured simultaneously
    - missing, empty, oversized, or unsafe-permission files fail closed
    - Compose grants each service only its declared secret files
    - migration preserves existing mobile and browser behavior
