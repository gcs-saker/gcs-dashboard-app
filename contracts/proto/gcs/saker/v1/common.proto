syntax = "proto3";

package gcs.saker.v1;

option go_package = "github.com/gcs-saker/gcs-dashboard-app/contracts/gen/go/gcs/saker/v1;sakerv1";
option java_multiple_files = true;
option java_package = "kr.co.a4ai.gcssaker.contracts.v1";

message GeoPoint {
  double latitude = 1;
  double longitude = 2;
  double altitude_m = 3;
}

message Vector3 {
  double x = 1;
  double y = 2;
  double z = 3;
}

message Timestamped {
  int64 observed_unix_millis = 1;
  int64 received_unix_millis = 2;
}

enum AssetKind {
  ASSET_KIND_UNSPECIFIED = 0;
  ASSET_KIND_DRONE = 1;
  ASSET_KIND_GROUND_ROBOT = 2;
  ASSET_KIND_FIXED_CAMERA = 3;
  ASSET_KIND_OPERATOR_DEVICE = 4;
}

enum HealthState {
  HEALTH_STATE_UNSPECIFIED = 0;
  HEALTH_STATE_OK = 1;
  HEALTH_STATE_WARN = 2;
  HEALTH_STATE_ERROR = 3;
  HEALTH_STATE_OFFLINE = 4;
}
