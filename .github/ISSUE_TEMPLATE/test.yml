name: Test task
description: Define manual, automated, smoke, load, or E2E verification
title: "[P?][Test] "
labels: ["type: test"]
body:
  - type: textarea
    id: scope
    attributes:
      label: Test scope
      description: What behavior or environment is being verified?
    validations:
      required: true
  - type: textarea
    id: procedure
    attributes:
      label: Procedure
      placeholder: |
        1. Prepare ...
        2. Run ...
        3. Confirm ...
    validations:
      required: true
  - type: textarea
    id: pass_fail
    attributes:
      label: Pass/fail criteria
      placeholder: |
        - First frame appears within 3 seconds
        - API returns 2xx
        - No fatal logs for 30 minutes
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: Attach logs, screenshots, metrics, or command output.
  - type: dropdown
    id: blocked_handling
    attributes:
      label: External dependency handling
      description: Missing physical equipment or access must be BLOCKED, never PASS.
      options:
        - No external dependency
        - Physical equipment required
        - External access or authority required
    validations:
      required: true
