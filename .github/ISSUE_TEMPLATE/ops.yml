name: Operations task
description: Track deployment, infrastructure, backup, rollback, or runbook work
title: "[P?][Ops] "
labels: ["type: ops"]
body:
  - type: markdown
    attributes:
      value: Production scope is Server-01 on SSH port 55121 only. Do not use Server-02/55122.
  - type: textarea
    id: objective
    attributes:
      label: Objective
      description: What operational state should be achieved?
    validations:
      required: true
  - type: textarea
    id: checklist
    attributes:
      label: Checklist
      placeholder: |
        - [ ] Backup current state
        - [ ] Apply change
        - [ ] Verify health checks
        - [ ] Record rollback path
    validations:
      required: true
  - type: textarea
    id: impact
    attributes:
      label: Operational impact
      description: Expected downtime, exposed ports, credentials, or network changes.
  - type: textarea
    id: rollback
    attributes:
      label: Rollback plan
      description: How do we return to the previous working state?
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Completion and evidence
      placeholder: |
        - [ ] Backup verified when stateful services are affected
        - [ ] Public health/readiness PASS
        - [ ] Authorization denial PASS
        - [ ] Container health and source revision PASS
        - [ ] New 5xx/restart/OOM checked
    validations:
      required: true
