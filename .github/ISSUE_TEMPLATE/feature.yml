name: Feature request
description: Plan a new product or platform capability
title: "[Feature]: "
labels: ["type: feature"]
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What should be built?
      placeholder: Describe the capability and expected outcome.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: What must be true before this issue can close?
      placeholder: |
        - API/UI behavior is implemented
        - Tests or verification steps pass
        - Documentation is updated if needed
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - dashboard
        - backend
        - streaming
        - telemetry
        - infra
        - docs
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Notes
      description: Links, screenshots, diagrams, or constraints.
