name: Feature request
description: Plan a new product or platform capability
title: "[P?][Area] "
labels: ["type: feature"]
body:
  - type: markdown
    attributes:
      value: Describe the user or device outcome before proposing implementation details.
  - type: textarea
    id: problem
    attributes:
      label: User or operational need
      description: Who needs this capability and what can they not achieve today?
    validations:
      required: true
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What should be built?
      placeholder: Describe the capability and expected outcome.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: What must be true before this issue can close?
      placeholder: |
        - API/UI behavior is implemented
        - Tests or verification steps pass
        - Documentation is updated if needed
    validations:
      required: true
  - type: textarea
    id: boundaries
    attributes:
      label: Architecture and security boundaries
      description: Identify the owning service, affected contracts, authorization boundary, and data that must remain server-owned.
    validations:
      required: true
  - type: textarea
    id: compatibility
    attributes:
      label: Compatibility and migration
      description: Existing clients, APIs, protobuf, database, environment, or rollout considerations.
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - dashboard
        - backend
        - streaming
        - telemetry
        - infra
        - docs
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Notes
      description: Links, screenshots, diagrams, or constraints.
