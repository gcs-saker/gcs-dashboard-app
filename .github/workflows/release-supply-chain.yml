name: Signed release supply chain

on:
  workflow_dispatch:
    inputs:
      mobile_release_run_id:
        description: Successful gcs-mobile-publisher signed release workflow run ID
        required: true
        type: string
  push:
    tags:
      - "v*"

concurrency:
  group: signed-release-${{ github.ref }}
  cancel-in-progress: false

permissions: {}

jobs:
  verified-ci:
    name: verify-source-ci
    runs-on: ubuntu-latest
    permissions:
      checks: read
      contents: read
    steps:
      - name: Require successful source checks
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          required=(backend-test frontend-build auth-policy-test media-control-test repository-contracts)
          checks="$(gh api --paginate "/repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/check-runs?per_page=100")"
          for name in "${required[@]}"; do
            jq -e --arg name "$name" \
              '[.check_runs[] | select(.name == $name and .conclusion == "success")] | length > 0' \
              <<<"$checks" >/dev/null || {
                echo "required successful check is missing: $name" >&2
                exit 1
              }
          done

  signed-images:
    name: sign-${{ matrix.image }}
    runs-on: ubuntu-latest
    environment: military-release
    needs: verified-ci
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      artifact-metadata: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: backend
            context: backend
            file: backend/Dockerfile
            build_contexts: ""
          - image: auth-policy
            context: services/auth-policy
            file: services/auth-policy/Dockerfile
            build_contexts: contracts=contracts
          - image: media-control
            context: services/media-control
            file: services/media-control/Dockerfile
            build_contexts: ""
          - image: dashboard
            context: gcs-dashboard
            file: gcs-dashboard/Dockerfile
            build_contexts: ""
    steps:
      - name: Checkout immutable source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Set up Java for auth-policy dependency evidence
        if: matrix.image == 'auth-policy'
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
          cache-dependency-path: services/auth-policy/gradle/wrapper/gradle-wrapper.properties

      - name: Export authoritative auth-policy runtime coordinates
        if: matrix.image == 'auth-policy'
        working-directory: services/auth-policy
        run: ./gradlew writeRuntimeDependencyManifest --no-daemon

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Authenticate to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Define immutable image name
        shell: bash
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/gcs-saker-${{ matrix.image }}" >> "$GITHUB_ENV"

      - name: Build and push digest-addressable image
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          build-contexts: ${{ matrix.build_contexts }}
          push: true
          tags: ${{ env.IMAGE }}:${{ github.sha }}
          build-args: SOURCE_COMMIT=${{ github.sha }}
          provenance: mode=max
          sbom: false

      - name: Generate SPDX SBOM for immutable image
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          image: ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}
          format: spdx-json
          output-file: ${{ runner.temp }}/${{ matrix.image }}.raw.spdx.json
          artifact-name: ${{ matrix.image }}-release-sbom-raw.spdx.json

      - name: Reconcile auth-policy Maven coordinates
        if: matrix.image == 'auth-policy'
        shell: bash
        run: |
          python scripts/reports/reconcile_maven_sbom.py \
            --sbom "${RUNNER_TEMP}/${{ matrix.image }}.raw.spdx.json" \
            --manifest services/auth-policy/build/reports/runtime-dependencies.json \
            --output "${RUNNER_TEMP}/${{ matrix.image }}.spdx.json" \
            --report "${RUNNER_TEMP}/${{ matrix.image }}.maven-reconciliation.json" \
            --expected-corrections 27

      - name: Preserve unchanged non-Maven SBOM
        if: matrix.image != 'auth-policy'
        shell: bash
        run: cp "${RUNNER_TEMP}/${{ matrix.image }}.raw.spdx.json" "${RUNNER_TEMP}/${{ matrix.image }}.spdx.json"

      - name: Generate license disposition and notices
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check PyYAML==6.0.2
          python scripts/reports/license_compliance.py \
            --sbom "${RUNNER_TEMP}/${{ matrix.image }}.spdx.json" \
            --policy docs/compliance/supply-chain/supply-chain-policy.yml \
            --approvals docs/compliance/supply-chain/license-approvals.yml \
            --resolutions docs/compliance/supply-chain/license-resolutions.yml \
            --report "${RUNNER_TEMP}/${{ matrix.image }}.license-report.json" \
            --notices "${RUNNER_TEMP}/${{ matrix.image }}.THIRD_PARTY_NOTICES.md"

      - name: Upload license review evidence
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: ${{ matrix.image }}-license-review-evidence
          path: |
            ${{ runner.temp }}/${{ matrix.image }}.spdx.json
            ${{ runner.temp }}/${{ matrix.image }}.maven-reconciliation.json
            ${{ runner.temp }}/${{ matrix.image }}.license-report.json
            ${{ runner.temp }}/${{ matrix.image }}.THIRD_PARTY_NOTICES.md
          if-no-files-found: error

      - name: Enforce approved license disposition
        shell: bash
        run: |
          python scripts/reports/license_compliance.py \
            --sbom "${RUNNER_TEMP}/${{ matrix.image }}.spdx.json" \
            --policy docs/compliance/supply-chain/supply-chain-policy.yml \
            --approvals docs/compliance/supply-chain/license-approvals.yml \
            --resolutions docs/compliance/supply-chain/license-resolutions.yml \
            --report "${RUNNER_TEMP}/${{ matrix.image }}.license-report.json" \
            --notices "${RUNNER_TEMP}/${{ matrix.image }}.THIRD_PARTY_NOTICES.md" \
            --enforce

      - name: Block fixed high and critical vulnerabilities
        uses: anchore/scan-action@1638637db639e0ade3258b51db49a9a137574c3e # v6
        with:
          image: ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}
          fail-build: true
          severity-cutoff: high
          only-fixed: true

      - name: Attest SLSA build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Attest SPDX SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          sbom-path: ${{ runner.temp }}/${{ matrix.image }}.spdx.json
          push-to-registry: true

      - name: Install verified Cosign release
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign immutable image with GitHub OIDC
        shell: bash
        run: |
          cosign sign --yes \
            --bundle "${RUNNER_TEMP}/${{ matrix.image }}.cosign.bundle.json" \
            "${IMAGE}@${{ steps.build.outputs.digest }}"

      - name: Verify signer identity and immutable digest
        shell: bash
        run: |
          cosign verify \
            --certificate-identity-regexp '^https://github.com/gcs-saker/gcs-dashboard-app/.github/workflows/release-supply-chain.yml@refs/(tags|heads)/' \
            --certificate-oidc-issuer 'https://token.actions.githubusercontent.com' \
            "${IMAGE}@${{ steps.build.outputs.digest }}"

      - name: Create signed release manifest entry
        shell: bash
        run: |
          python scripts/ops/release_manifest.py entry \
            --service "${{ matrix.image }}" \
            --image "${IMAGE}" \
            --digest "${{ steps.build.outputs.digest }}" \
            --sbom "${RUNNER_TEMP}/${{ matrix.image }}.spdx.json" \
            --license-report "${RUNNER_TEMP}/${{ matrix.image }}.license-report.json" \
            --notices "${RUNNER_TEMP}/${{ matrix.image }}.THIRD_PARTY_NOTICES.md" \
            --output "${RUNNER_TEMP}/release-entry.json"

      - name: Upload signed release evidence
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: ${{ matrix.image }}-signed-release-evidence
          if-no-files-found: error
          retention-days: 90
          path: |
            ${{ runner.temp }}/${{ matrix.image }}.spdx.json
            ${{ runner.temp }}/${{ matrix.image }}.cosign.bundle.json
            ${{ runner.temp }}/${{ matrix.image }}.license-report.json
            ${{ runner.temp }}/${{ matrix.image }}.THIRD_PARTY_NOTICES.md
            ${{ runner.temp }}/release-entry.json

  mobile-publisher-evidence:
    name: verify-mobile-publisher-release
    runs-on: ubuntu-latest
    environment: military-release
    needs: verified-ci
    permissions:
      actions: read
      contents: read
      id-token: write
      packages: read
    steps:
      - name: Resolve immutable mobile release run
        env:
          GH_TOKEN: ${{ github.token }}
          MOBILE_RELEASE_RUN_ID: ${{ inputs.mobile_release_run_id || vars.MOBILE_PUBLISHER_RELEASE_RUN_ID }}
        shell: bash
        run: |
          test -n "${MOBILE_RELEASE_RUN_ID}" || {
            echo "mobile publisher signed release run ID is required" >&2
            exit 1
          }
          conclusion="$(gh api "/repos/gcs-saker/gcs-mobile-publisher/actions/runs/${MOBILE_RELEASE_RUN_ID}" --jq .conclusion)"
          test "${conclusion}" = success || {
            echo "mobile publisher release run did not succeed" >&2
            exit 1
          }
          artifact_id="$(gh api "/repos/gcs-saker/gcs-mobile-publisher/actions/runs/${MOBILE_RELEASE_RUN_ID}/artifacts" \
            --jq '.artifacts[] | select(.name == "mobile-publisher-signed-release-evidence" and .expired == false) | .id' | head -1)"
          test -n "${artifact_id}" || {
            echo "mobile publisher signed evidence is unavailable" >&2
            exit 1
          }
          echo "MOBILE_ARTIFACT_ID=${artifact_id}" >> "$GITHUB_ENV"

      - name: Download mobile signed evidence
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          mkdir -p "${RUNNER_TEMP}/mobile-evidence"
          gh api "/repos/gcs-saker/gcs-mobile-publisher/actions/artifacts/${MOBILE_ARTIFACT_ID}/zip" \
            > "${RUNNER_TEMP}/mobile-evidence.zip"
          unzip -q "${RUNNER_TEMP}/mobile-evidence.zip" -d "${RUNNER_TEMP}/mobile-evidence-raw"
          for evidence_name in mobile-release-entry.json mobile-publisher.spdx.json license-report.json THIRD_PARTY_NOTICES.md mobile-publisher.cosign.bundle.json; do
            evidence_path="$(find "${RUNNER_TEMP}/mobile-evidence-raw" -type f -name "${evidence_name}" -print -quit)"
            test -n "${evidence_path}" || {
              echo "mobile publisher evidence file is missing: ${evidence_name}" >&2
              exit 1
            }
            cp "${evidence_path}" "${RUNNER_TEMP}/mobile-evidence/${evidence_name}"
          done

      - name: Verify mobile evidence hashes and disposition
        shell: bash
        run: |
          cd "${RUNNER_TEMP}/mobile-evidence"
          jq -e '.service == "mobile-publisher" and .licenseReleaseAllowed == true' mobile-release-entry.json >/dev/null
          test "$(sha256sum mobile-publisher.spdx.json | cut -d' ' -f1)" = "$(jq -r .sbomSha256 mobile-release-entry.json)"
          test "$(sha256sum license-report.json | cut -d' ' -f1)" = "$(jq -r .licenseReportSha256 mobile-release-entry.json)"
          test "$(sha256sum THIRD_PARTY_NOTICES.md | cut -d' ' -f1)" = "$(jq -r .noticesSha256 mobile-release-entry.json)"
          jq -e '.releaseAllowed == true and (.blockedLicenses | length == 0)' license-report.json >/dev/null

      - name: Install verified Cosign release
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Authenticate to GHCR for mobile signature verification
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify mobile publisher signer identity
        shell: bash
        run: |
          image="$(jq -r .image "${RUNNER_TEMP}/mobile-evidence/mobile-release-entry.json")"
          cosign verify \
            --certificate-identity-regexp '^https://github.com/gcs-saker/gcs-mobile-publisher/.github/workflows/signed-release.yml@refs/(tags|heads)/' \
            --certificate-oidc-issuer 'https://token.actions.githubusercontent.com' \
            "${image}"

      - name: Upload verified mobile evidence for integration
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: mobile-publisher-signed-release-evidence
          if-no-files-found: error
          retention-days: 90
          path: ${{ runner.temp }}/mobile-evidence/*

  signed-manifest:
    name: sign-release-manifest
    runs-on: ubuntu-latest
    environment: military-release
    needs: [signed-images, mobile-publisher-evidence]
    permissions:
      actions: read
      contents: read
      id-token: write
    steps:
      - name: Checkout immutable source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Download verified image evidence
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          pattern: "*-signed-release-evidence"
          path: ${{ runner.temp }}/release-evidence

      - name: Assemble release manifest
        shell: bash
        run: |
          python scripts/ops/release_manifest.py assemble \
            --entries-root "${RUNNER_TEMP}/release-evidence" \
            --source-commit "${GITHUB_SHA}" \
            --workflow-run "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            --output "${RUNNER_TEMP}/release-manifest.json"

      - name: Install verified Cosign release
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign and verify release manifest
        shell: bash
        run: |
          cosign sign-blob --yes --bundle "${RUNNER_TEMP}/release-manifest.cosign.bundle.json" \
            "${RUNNER_TEMP}/release-manifest.json"
          cosign verify-blob \
            --bundle "${RUNNER_TEMP}/release-manifest.cosign.bundle.json" \
            --certificate-identity-regexp '^https://github.com/gcs-saker/gcs-dashboard-app/.github/workflows/release-supply-chain.yml@refs/(tags|heads)/' \
            --certificate-oidc-issuer 'https://token.actions.githubusercontent.com' \
            "${RUNNER_TEMP}/release-manifest.json"

      - name: Upload deployable signed manifest
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: signed-release-manifest
          if-no-files-found: error
          retention-days: 90
          path: |
            ${{ runner.temp }}/release-manifest.json
            ${{ runner.temp }}/release-manifest.cosign.bundle.json
