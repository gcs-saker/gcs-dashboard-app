name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  auth-policy-test:
    name: auth-policy-test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/auth-policy
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
          cache-dependency-path: |
            services/auth-policy/*.gradle.kts
            services/auth-policy/gradle/wrapper/gradle-wrapper.properties

      - name: Run auth-policy tests
        run: ./gradlew test --no-daemon

  backend-test:
    name: backend-test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install protobuf compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Audit backend dependencies
        run: |
          python -m pip_audit -r requirements.txt --no-deps --disable-pip
          python -m pip_audit --local

      - name: Compile backend modules
        run: python -m compileall -q -x '(^|/)(venv|__pycache__|.pytest_cache)/' .

      - name: Typecheck backend core modules
        run: python -m mypy config.py model/stream_model.py modules/streaming modules/ai_contract api/stream.py mqtt/client.py

      - name: Run backend tests with coverage
        run: python -m pytest tests --cov=. --cov-report=term-missing

  frontend-build:
    name: frontend-build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gcs-dashboard
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: gcs-dashboard/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Audit frontend dependencies
        run: npm run audit

      - name: Typecheck frontend
        run: npm run typecheck

      - name: Run frontend tests with coverage
        run: npm run test:coverage
        env:
          CI: "true"

      - name: Build frontend
        run: npm run build
        env:
          CI: "false"
