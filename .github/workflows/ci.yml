name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  schedule:
    - cron: "17 0 * * *"

permissions:
  contents: read

jobs:
  public-tls-smoke:
    name: public-tls-smoke
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify production certificate chain and expiry
        run: scripts/ops/check_public_tls.sh a4ai.121-159-26-245.sslip.io 443

  media-control-test:
    name: media-control-test
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7.4.2-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    defaults:
      run:
        working-directory: services/media-control
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: services/media-control/go.mod
          cache-dependency-path: services/media-control/go.sum

      - name: Verify generated Go protobuf contracts
        working-directory: .
        run: |
          python -m pip install grpcio-tools==1.76.0
          GOBIN="$RUNNER_TEMP/proto-bin" go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.11
          GOBIN="$RUNNER_TEMP/proto-bin" go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@v1.6.1
          mkdir -p "$RUNNER_TEMP/go-contracts"
          python -m grpc_tools.protoc -Icontracts/proto \
            --plugin=protoc-gen-go="$RUNNER_TEMP/proto-bin/protoc-gen-go" \
            --plugin=protoc-gen-go-grpc="$RUNNER_TEMP/proto-bin/protoc-gen-go-grpc" \
            --go_out="$RUNNER_TEMP/go-contracts" --go_opt=paths=source_relative \
            --go-grpc_out="$RUNNER_TEMP/go-contracts" --go-grpc_opt=paths=source_relative \
            contracts/proto/gcs/saker/v1/{common,stream_control,telemetry,gateway_service}.proto
          diff -ru services/media-control/internal/generated "$RUNNER_TEMP/go-contracts"

      - name: Run race tests
        run: go test -race -cover ./...
        env:
          TEST_REDIS_ADDR: 127.0.0.1:6379

      - name: Run vet
        run: go vet ./...

      - name: Build runtime image
        run: docker build -t gcs-saker-media-control:ci .

      - name: Generate media-control SBOM
        uses: anchore/sbom-action@v0
        with:
          image: gcs-saker-media-control:ci
          artifact-name: media-control-sbom.spdx.json

      - name: Scan media-control runtime image
        uses: anchore/scan-action@v6
        with:
          image: gcs-saker-media-control:ci
          fail-build: true
          severity-cutoff: high
          only-fixed: true

      - name: Scan reachable vulnerabilities
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  auth-policy-test:
    name: auth-policy-test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/auth-policy
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
          cache-dependency-path: |
            services/auth-policy/*.gradle.kts
            services/auth-policy/gradle/wrapper/gradle-wrapper.properties

      - name: Run auth-policy tests
        run: ./gradlew check --no-daemon

      - name: Build auth-policy runtime image
        run: docker build -t gcs-saker-auth-policy:ci .

      - name: Generate auth-policy SBOM
        uses: anchore/sbom-action@v0
        with:
          image: gcs-saker-auth-policy:ci
          artifact-name: auth-policy-sbom.spdx.json

      - name: Scan auth-policy runtime image
        uses: anchore/scan-action@v6
        with:
          image: gcs-saker-auth-policy:ci
          fail-build: true
          severity-cutoff: high
          only-fixed: true

  backend-test:
    name: backend-test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install protobuf compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify generated Python protobuf contracts
        working-directory: .
        run: |
          temp_dir="$(mktemp -d)"
          python -m grpc_tools.protoc -Icontracts/proto --python_out="$temp_dir" \
            contracts/proto/gcs/saker/v1/{common,stream_control,telemetry,gateway_service}.proto
          diff -ru backend/gcs "$temp_dir/gcs"

      - name: Audit backend dependencies
        run: |
          python -m pip_audit -r requirements.txt --no-deps --disable-pip
          python -m pip_audit --local

      - name: Compile backend modules
        run: python -m compileall -q -x '(^|/)(venv|__pycache__|.pytest_cache)/' .

      - name: Lint and verify backend formatting
        run: |
          python -m ruff check . ../scripts
          python -m ruff format --check . ../scripts
          python ../scripts/gates/source_size_contract.py
          python ../scripts/gates/frontend_boundary_contract.py

      - name: Typecheck all backend modules and tests
        run: python -m mypy .

      - name: Run backend tests with coverage
        run: python -m pytest tests --cov=. --cov-report=term-missing --cov-fail-under=85

      - name: Build backend runtime image
        run: docker build -t gcs-saker-backend:ci .

      - name: Generate backend SBOM
        uses: anchore/sbom-action@v0
        with:
          image: gcs-saker-backend:ci
          artifact-name: backend-sbom.spdx.json

      - name: Scan backend runtime image
        uses: anchore/scan-action@v6
        env:
          GRYPE_CONFIG: ${{ github.workspace }}/.github/grype/backend-python312.yaml
        with:
          image: gcs-saker-backend:ci
          fail-build: true
          severity-cutoff: high
          only-fixed: true

  frontend-build:
    name: frontend-build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gcs-dashboard
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: gcs-dashboard/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Audit frontend dependencies
        run: npm run audit

      - name: Typecheck frontend
        run: |
          npm run lint:hooks
          npm run lint:quality
          npm run typecheck

      - name: Run frontend tests with coverage
        run: npm run test:coverage
        env:
          CI: "true"

      - name: Build frontend
        run: npm run build
        env:
          CI: "false"

      - name: Build dashboard runtime image
        run: docker build -t gcs-saker-dashboard:ci .

      - name: Generate dashboard SBOM
        uses: anchore/sbom-action@v0
        with:
          image: gcs-saker-dashboard:ci
          artifact-name: dashboard-sbom.spdx.json

      - name: Scan dashboard runtime image
        uses: anchore/scan-action@v6
        with:
          image: gcs-saker-dashboard:ci
          fail-build: true
          severity-cutoff: high
          only-fixed: true

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run browser smoke tests
        run: npm run test:e2e
        env:
          CI: "true"

      - name: Upload browser diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            gcs-dashboard/playwright-report
            gcs-dashboard/test-results
          if-no-files-found: ignore

  repository-contracts:
    name: repository-contracts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reject CRLF in Linux runtime files
        run: |
          if git grep -Il $'\r' -- '*.sh' '*.py' '*.yml' '*.yaml' '*.go' '*.kt'; then
            echo 'CRLF found in Linux runtime files' >&2
            exit 1
          fi

      - name: Validate tracked text files are UTF-8
        run: python scripts/gates/utf8_text_contract.py

      - name: Validate canonical script entrypoints
        run: python scripts/gates/script_entrypoint_contract.py

      - name: Validate repository structure and naming
        run: python scripts/gates/repository_hygiene_contract.py

      - name: Reject critical security and resource anti-patterns
        run: python scripts/gates/critical_code_contract.py

      - name: Prevent code quality baseline growth
        env:
          QUALITY_REFERENCE_REF: ${{ github.event.pull_request.base.sha || github.event.before || '' }}
        run: |
          if [ -n "$QUALITY_REFERENCE_REF" ] && [ "$QUALITY_REFERENCE_REF" != "0000000000000000000000000000000000000000" ]; then
            python scripts/gates/code_quality_baseline.py --check --reference-ref "$QUALITY_REFERENCE_REF"
          else
            python scripts/gates/code_quality_baseline.py --check
          fi

      - name: Validate shell syntax
        run: find scripts deploy -type f -name '*.sh' -print0 | xargs -0 -r bash -n

      - name: Validate compose security contract
        env:
          POSTGRES_PASSWORD: contract-only
          MQTT_HEALTH_USERNAME: health
          MQTT_HEALTH_PASSWORD: contract-only
          MQTT_PASSWORD_FILE: ../deploy/mosquitto/passwords.example
          DATABASE_URL: postgresql://gcs_geo:contract-only@postgres:5432/gcs_geo
          AUTH_JWT_SECRET: contract-only-secret-at-least-32-characters
          MQTT_USERNAME: backend
          MQTT_PASSWORD: contract-only
          MEDIA_CONTROL_PUBLISH_TOKEN: contract-only-secret-at-least-32-characters
          AUTH_POLICY_BASE_URL: http://auth-policy:8080
          REDIS_PASSWORD: contract-only-secret
        run: |
          docker compose -f gcs-dashboard/docker-compose.yml config > /tmp/gcs-compose.yml
          ! grep -q 'MEDIA_CONTROL_AUTH_MODE: allow-all' /tmp/gcs-compose.yml
          grep -q 'MEDIA_CONTROL_AUTH_MODE: required' /tmp/gcs-compose.yml
          grep -q 'MEDIA_CONTROL_REDIS_ADDR: redis:6379' /tmp/gcs-compose.yml
