[project]
name = "gcs-saker-backend"
version = "0.2.0"
requires-python = ">=3.12,<3.13"

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_unused_configs = true
no_implicit_optional = true
check_untyped_defs = true
explicit_package_bases = true

[tool.ruff]
target-version = "py312"
line-length = 120
src = ["."]
extend-exclude = [
  ".pytest_cache",
  "__pycache__",
  "venv",
]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
